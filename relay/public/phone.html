<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2547">
  <meta name="referrer" content="no-referrer">
  <title>Exercise Unlock</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section id="screen-start" class="screen center">
      <img class="logo" src="/static/logo.svg" alt="">
      <h1>Exercise Unlock</h1>
      <p id="start-msg" class="msg"></p>
      <button id="btn-start" class="primary" hidden></button>
      <p id="place-hint" class="hint"></p>
    </section>

    <section id="screen-live" class="screen live" hidden>
      <div class="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="banner" class="banner"></div>
        <div id="toast" class="toast" hidden></div>
        <div id="count" class="count" hidden></div>
        <pre id="debug" class="debug" hidden></pre>
      </div>
      <div class="panel">
        <div id="counters" class="counters"></div>
        <div id="progress" class="progress"><div class="bar"><div id="bar-fill"></div></div><span id="earned-text"></span></div>
        <div id="calib" class="calib" hidden>
          <div id="calib-reps" class="calib-reps" hidden><b id="reps-n">0</b><span id="reps-of"></span></div>
          <p id="calib-text"></p>
          <ul id="calib-lines" class="calib-lines" hidden></ul>
          <button id="btn-photo" class="primary" hidden></button>
          <div id="calib-nav" class="calib-nav" hidden>
            <button id="btn-back" class="ghost"></button>
            <button id="btn-skip" class="ghost"></button>
            <button id="btn-next" class="primary"></button>
          </div>
        </div>
        <button id="btn-flip" class="ghost flip">
          <!-- a camera with two arrows going round: front <-> back -->
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h3l2-2.2h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/>
            <path d="M8.6 12.4a3.5 3.5 0 0 1 6.1-1.9"/>
            <path d="M15 8.7l-.3 1.8-1.8-.3"/>
            <path d="M15.4 13.6a3.5 3.5 0 0 1-6.1 1.9"/>
            <path d="M9 17.3l.3-1.8 1.8.3"/>
          </svg>
          <span id="flip-text"></span>
        </button>
      </div>
    </section>

    <section id="screen-end" class="screen center" hidden>
      <img class="logo" src="/static/logo.svg" alt="">
      <h1 id="end-title"></h1>
      <p id="end-msg" class="msg"></p>
    </section>
  </main>

  <script src="/vendor/tf-core.min.js"></script>
  <script src="/vendor/tf-converter.min.js"></script>
  <script src="/vendor/tf-backend-webgl.min.js"></script>
  <script src="/static/exercises.js"></script>
  <script src="/static/synth.js"></script>
  <script src="/static/phone.js"></script>
</body>
</html>
