<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2547">
  <meta name="referrer" content="no-referrer">
  <title>Exercise Unlock</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section id="screen-start" class="screen center">
      <img class="logo" src="/static/logo.svg" alt="">
      <h1>Exercise Unlock</h1>
      <p id="start-msg" class="msg"></p>
      <button id="btn-start" class="primary" hidden></button>
      <p id="place-hint" class="hint"></p>
    </section>

    <section id="screen-live" class="screen live" hidden>
      <div class="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="banner" class="banner"></div>
        <div id="toast" class="toast" hidden></div>
        <pre id="debug" class="debug" hidden></pre>
      </div>
      <div class="panel">
        <div id="counters" class="counters"></div>
        <div class="progress"><div class="bar"><div id="bar-fill"></div></div><span id="earned-text"></span></div>
        <button id="btn-flip" class="ghost"></button>
      </div>
    </section>

    <section id="screen-end" class="screen center" hidden>
      <img class="logo" src="/static/logo.svg" alt="">
      <h1 id="end-title"></h1>
      <p id="end-msg" class="msg"></p>
    </section>
  </main>

  <script src="/vendor/tf-core.min.js"></script>
  <script src="/vendor/tf-converter.min.js"></script>
  <script src="/vendor/tf-backend-webgl.min.js"></script>
  <script src="/static/exercises.js"></script>
  <script src="/static/synth.js"></script>
  <script src="/static/phone.js"></script>
</body>
</html>
