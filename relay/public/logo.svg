<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Exercise Unlock: a kettlebell whose handle opens like a padlock's
       shackle; the keyhole is a child with both arms up. Colours as the
       phone page (relay/public): green #2bff88 on navy #1f2547. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3a86"/>
      <stop offset="1" stop-color="#151a3e"/>
    </linearGradient>
    <linearGradient id="bell" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7dffbc"/>
      <stop offset="0.55" stop-color="#2bff88"/>
      <stop offset="1" stop-color="#12c98a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9e1ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.66" r="0.5">
      <stop offset="0" stop-color="#2bff88" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2bff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <g transform="translate(4 3)">
    <!-- handle, tilted open like a shackle -->
    <path transform="rotate(-16 84 124)" d="M82 132 V94 Q82 62 114 62 H142 Q174 62 174 94 V96"
          fill="none" stroke="url(#handle)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- round bell with a narrow flat foot -->
    <path d="M98 223 A72 72 0 1 1 158 223 Z" fill="url(#bell)"/>
    <ellipse cx="92" cy="138" rx="20" ry="11" transform="rotate(-42 92 138)" fill="#ffffff" fill-opacity="0.30"/>

    <!-- keyhole person, arms up -->
    <g fill="#1a2050" stroke="#1a2050" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="128" cy="142" r="12.5" stroke="none"/>
      <path d="M121 163 L135 163 L143 198 Q144 203 139 203 L117 203 Q112 203 113 198 Z" stroke="none"/>
      <path d="M123 167 L103 145 M133 167 L153 145" fill="none" stroke-width="10"/>
    </g>
  </g>
</svg>
