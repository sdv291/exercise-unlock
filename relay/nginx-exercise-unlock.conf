# nginx site for the Exercise Unlock relay.
#   sudo cp nginx-exercise-unlock.conf /etc/nginx/conf.d/exercise-unlock.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d exercise-unlock.sdv291.com
# certbot then adds the 443 / certificate lines to this server block and a
# redirect from http.

# WebSocket upgrade (own variable name, so it can't clash with a
# $connection_upgrade map another site may already define).
map $http_upgrade $eu_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name exercise-unlock.sdv291.com;

    # Pairing codes travel in URLs (/s/<code>, /ws/phone?token=<code>):
    # don't write them into the access log.
    access_log off;

    # Landing page (PHP + php-fpm) at /landing/ - the page lives in
    # /var/www/exercise-unlock/landing/index.php, its settings one level up
    # in /var/www/exercise-unlock/landing-config.php (never served).
    location = /landing { return 301 /landing/; }
    location ^~ /landing/ {
        root /var/www/exercise-unlock;
        index index.php;
        location ~ /\. { deny all; }
        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # the socket in /run/php/ on your VPS
        }
    }

    # The installer the landing's email links to:
    # /var/www/exercise-unlock/download/ExerciseUnlock-Setup.exe
    location ^~ /download/ {
        root /var/www/exercise-unlock;
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;          # RELAY_PORT in docker-compose.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $eu_connection_upgrade;
        proxy_set_header Host $host;
        # Connections stay open for the whole exercise session; both ends
        # ping every 15-25 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
