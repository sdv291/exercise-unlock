; Exercise Unlock — lock-screen tile sounds (installed default).
; Full format description: ExerciseUnlockProvider\sounds.ini.sample
; in the source tree. Each key takes one or more comma-separated
; .wav files (PCM); one is picked at random per event. Empty key ->
; standard Windows beep. Files are looked up in the sounds folder
; next to this file unless `library = <folder>` says otherwise.

[sounds]
squat_ready    = squat_ready.wav
pushup_ready   = pushup_ready.wav
squat_counted  = squat_counted.wav
pushup_counted = pushup_counted.wav
situp_ready    = pushup_ready.wav
situp_counted  = pushup_counted.wav
error          = error.wav
