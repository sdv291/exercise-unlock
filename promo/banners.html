<!doctype html>
<!-- Instagram banners, rendered by banners.py:
       banners.html?c=hero|earn|hour|ai|laptop|phone&l=uk|en&f=feed|story
     feed = 1080x1350 (4:5), story = 1080x1920 (9:16; text kept clear of
     the top and bottom ~250 px the Instagram UI covers). The boy is
     assets/kid-*.webp, the logo branding/app-icon.svg. The AI skeletons
     on him are MoveNet Lightning's own joints for those pictures (KP); the
     ones on the laptop and the phone come from relay/public/synth.js. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=block" rel="stylesheet">
<style>
  :root { --navy: #1f2547; --neon: #2bff88; --ink: #f3f5ff; --muted: #c4cbf2; --pink: #ff2e88; --cyan: #15abcf; --yellow: #ffc21c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #151a3e; }
  .ad { position: relative; overflow: hidden; color: var(--ink); font-family: Nunito, 'Segoe UI', sans-serif;
        background: linear-gradient(160deg, #2e3a86 0%, #1f2547 45%, #151a3e 100%); }
  .feed { width: 1080px; height: 1350px; }
  .story { width: 1080px; height: 1920px; }

  /* light behind the boy, colour blobs from his clothes */
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .stage { position: absolute; border-radius: 50%;
           background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,.08) 45%, rgba(255,255,255,0) 70%); }
  .floor { position: absolute; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.45), rgba(0,0,0,0) 70%); }
  .kid { position: absolute; filter: drop-shadow(0 24px 40px rgba(0,0,0,.35)); }

  .brand { position: absolute; display: flex; align-items: center; gap: 20px; }
  .brand img { width: 88px; height: 88px; }
  .brand b { display: block; font-weight: 900; font-size: 42px; letter-spacing: .3px; line-height: 1.1; }
  .brand small { display: block; font-weight: 800; font-size: 25px; color: var(--muted); }

  h1 { position: absolute; font-weight: 900; line-height: 1.02; letter-spacing: -1px; }
  h1 em { font-style: normal; color: var(--neon); }
  .sub { position: absolute; font-weight: 700; color: var(--muted); line-height: 1.32; }

  /* the lock-screen tile, as the child sees it */
  .tile { position: absolute; background: rgba(10, 13, 34, .82); border: 2px solid rgba(255,255,255,.14);
          border-radius: 34px; padding: 30px 32px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .tile .top { display: flex; align-items: center; gap: 16px; font-weight: 900; font-size: 30px; }
  .tile .top img { width: 52px; height: 52px; }
  .tile .rows { display: flex; gap: 14px; margin: 22px 0 18px; }
  .tile .cnt { flex: 1; background: #283058; border-radius: 18px; padding: 10px 16px; display: flex; align-items: baseline; gap: 12px; }
  .tile .cnt b { font-size: 46px; font-weight: 900; color: var(--neon); }
  .tile .cnt span { font-size: 24px; color: var(--muted); font-weight: 800; }
  .tile .bar { height: 14px; background: #3c4677; border-radius: 7px; overflow: hidden; }
  .tile .bar i { display: block; height: 100%; width: 100%; background: var(--neon); }
  .tile .ok { margin-top: 12px; font-size: 25px; font-weight: 900; color: var(--neon); }

  /* minutes per rep */
  .chips { position: absolute; display: flex; flex-direction: column; gap: 18px; }
  .chip { display: flex; align-items: center; gap: 20px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14);
          border-radius: 26px; padding: 16px 26px 16px 18px; }
  .chip .dot { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .chip .dot svg { width: 40px; height: 40px; }
  .chip .what { font-size: 34px; font-weight: 800; }
  .chip .min { margin-left: auto; font-size: 40px; font-weight: 900; color: var(--yellow); white-space: nowrap; padding-left: 16px; }
  .note { position: absolute; font-size: 28px; font-weight: 800; color: var(--muted); }

  /* the hour */
  .clock { position: absolute; width: 300px; height: 300px; }
  .clock .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .clock .num b { display: block; font-size: 128px; font-weight: 900; line-height: .9; }
  .clock .num span { display: block; font-size: 36px; font-weight: 900; color: var(--muted); }
  .who { position: absolute; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); border-radius: 26px;
         padding: 22px 26px; font-size: 29px; font-weight: 800; line-height: 1.3; color: var(--muted); }
  .who b { color: var(--ink); }

  /* full rep counted, half rep not */
  .verdicts { position: absolute; display: flex; flex-direction: column; gap: 16px; }
  .verdict { display: flex; align-items: center; gap: 18px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14);
             border-radius: 24px; padding: 14px 22px 14px 14px; }
  .verdict i { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
               font-size: 34px; font-weight: 900; color: #0b2a18; flex: none; }
  .verdict b { font-size: 31px; font-weight: 900; display: block; line-height: 1.15; }
  .verdict span { font-size: 25px; font-weight: 800; display: block; }
  .layer { position: absolute; left: 0; top: 0; overflow: visible; }

  .cta { position: absolute; display: flex; flex-direction: column; gap: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 14px; align-self: flex-start; background: var(--neon); color: #0b2a18;
          font-weight: 900; font-size: 38px; padding: 20px 40px; border-radius: 999px; box-shadow: 0 12px 30px rgba(43,255,136,.3); }
  .url { font-size: 28px; font-weight: 800; color: var(--muted); }
</style>
</head>
<body>
<div id="ad"></div>
<script src="../relay/public/synth.js"></script>
<script>
const q = new URLSearchParams(location.search);
const C = q.get('c') || 'hero', L = q.get('l') || 'uk', F = q.get('f') || 'feed';

const TEXT = {
  uk: {
    hero: { h: ['Комп\'ютер', 'відкривається', '<em>вправами</em>'],
            sub: 'Присідання, віджимання й прес перед вебкамерою чи телефоном перетворюються на час за комп\'ютером.',
            tile: { squats: 'присідання', push: 'віджимання', ok: 'Зароблено 18:00 · можна заходити' } },
    earn: { h: ['Спочатку рух —', '<em>потім ігри</em>'],
            sub: 'Кожен повтор додає хвилини за комп\'ютером.',
            chips: [['squat', '1 присідання', '3 хв'], ['push', '1 віджимання', '6 хв'], ['sit', '1 прес', '5 хв']],
            note: 'Скільки коштує повтор, вирішуєте ви' },
    hour: { h: ['Щогодини —', '<em>перерва на рух</em>'],
            sub: 'Сеанс триває до 60 хвилин. Потім Windows блокується, і повернутися можна лише після вправ.',
            clock: ['60', 'хв'],
            who: '<b>ВООЗ радить</b> дітям щонайменше 60 хвилин руху на день' },
    ai: { h: ['ШІ бачить', '<em>кожен повтор</em>'],
          sub: 'Розпізнавання рухів працює на самому пристрої й рахує лише справжні, повні повтори. Відео нікуди не надсилається.',
          verdicts: [['ok', 'Повний присід', 'зараховано'], ['no', 'Напівприсід', 'не зараховано']],
          scan: '17 точок тіла', knee: 'коліно', elbow: 'лікоть' },
    laptop: { h: ['Присідання', '<em>замість пароля</em>'],
              sub: 'Windows відкривається вправами перед вебкамерою: ШІ бачить скелет і рахує повтори.',
              screen: { squats: 'присідання', knee: 'коліно' } },
    phone: { h: ['Немає вебкамери?', '<em>Підійде телефон</em>'],
             sub: 'Відскануйте QR-код на екрані блокування й поставте телефон на підлогу.',
             screen: { banner: 'Бачу тебе — присідай!', squats: 'Присідання' } },
    button: 'Отримати посилання',
    platform: 'для Windows 10 · 11',
    url: 'exercise-unlock.sdv291.com',
  },
  en: {
    hero: { h: ['The PC unlocks', '<em>with exercise</em>'],
            sub: 'Squats, push-ups and sit-ups in front of a webcam or a phone turn into screen time.',
            tile: { squats: 'squats', push: 'push-up', ok: 'Earned 18:00 · ready to unlock' } },
    earn: { h: ['Move first,', '<em>then play</em>'],
            sub: 'Every rep adds minutes of computer time.',
            chips: [['squat', '1 squat', '3 min'], ['push', '1 push-up', '6 min'], ['sit', '1 sit-up', '5 min']],
            note: 'You decide what every rep is worth' },
    hour: { h: ['A movement break', '<em>every hour</em>'],
            sub: 'A session lasts up to 60 minutes. Then Windows locks, and the way back is more exercise.',
            clock: ['60', 'min'],
            who: '<b>The WHO recommends</b> at least 60 minutes of activity a day for children' },
    ai: { h: ['AI sees', '<em>every rep</em>'],
          sub: 'Motion recognition runs on the device itself and counts only real, full reps. No video is sent anywhere.',
          verdicts: [['ok', 'Full squat', 'counted'], ['no', 'Half squat', 'not counted']],
          scan: '17 body points', knee: 'knee', elbow: 'elbow' },
    laptop: { h: ['Squats instead', '<em>of a password</em>'],
              sub: 'Windows unlocks with exercise in front of the webcam: the AI sees the skeleton and counts the reps.',
              screen: { squats: 'squats', knee: 'knee' } },
    phone: { h: ['No webcam?', '<em>Use a phone</em>'],
             sub: 'Scan the QR code on the lock screen and stand the phone on the floor.',
             screen: { banner: 'I can see you - squat!', squats: 'Squats' } },
    button: 'Get the link',
    platform: 'for Windows 10 · 11',
    url: 'exercise-unlock.sdv291.com',
  },
};
const T = TEXT[L], S = T[C];

// Simple stick figures for the chips: squat, push-up, sit-up.
const ICON = {
  squat: '<svg viewBox="0 0 40 40" fill="none" stroke="#1f2547" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="7" r="4" fill="#1f2547" stroke="none"/><path d="M21 12 L17 22 L26 26 L22 35 M17 22 L10 30 L14 35 M20 15 L30 17"/></svg>',
  push:  '<svg viewBox="0 0 40 40" fill="none" stroke="#1f2547" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="31" cy="15" r="4" fill="#1f2547" stroke="none"/><path d="M27 19 L5 27 M24 20 L26 32 M5 27 L4 32"/></svg>',
  sit:   '<svg viewBox="0 0 40 40" fill="none" stroke="#1f2547" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9" r="4" fill="#1f2547" stroke="none"/><path d="M16 14 L18 30 L28 20 L36 31 M16 17 L26 15"/></svg>',
};
const DOT = { squat: '#ffc21c', push: '#15abcf', sit: '#ff6fae' };

const KID = { hero: ['kid-polo', 1024, 1536], earn: ['kid-shoes', 1312, 1199], hour: ['kid-hoodie', 1024, 1536],
              ai: ['kid-hoodie', 1024, 1536], laptop: ['kid-polo', 1024, 1536], phone: ['kid-shoes', 1312, 1199] }[C];

// MoveNet SinglePose Lightning (the app's model) on the pictures themselves:
// [x, y, confidence] per COCO joint, normalized to the picture.
const KP = {
  'kid-hoodie': [[0.503,0.1564,0.54],[0.5393,0.1297,0.67],[0.4599,0.1329,0.86],[0.5916,0.1387,0.72],[0.4144,0.1463,0.65],
                 [0.6405,0.2669,0.85],[0.3685,0.2586,0.85],[0.6952,0.4084,0.81],[0.3149,0.4021,0.73],[0.6819,0.5199,0.57],
                 [0.3268,0.5122,0.77],[0.5907,0.5126,0.77],[0.4271,0.5094,0.84],[0.5951,0.7188,0.81],[0.361,0.7345,0.82],
                 [0.6253,0.9076,0.81],[0.2951,0.9155,0.84]],
  'kid-polo':   [[0.4737,0.1671,0.5],[0.497,0.127,0.61],[0.4271,0.1492,0.76],[0.572,0.1152,0.76],[0.4124,0.1661,0.72],
                 [0.6688,0.2798,0.9],[0.3652,0.2581,0.76],[0.6788,0.4262,0.65],[0.3287,0.4037,0.8],[0.6269,0.5486,0.67],
                 [0.3148,0.5164,0.71],[0.5724,0.5334,0.84],[0.4115,0.5247,0.79],[0.5684,0.7277,0.82],[0.3975,0.7235,0.91],
                 [0.5974,0.9062,0.82],[0.38,0.906,0.84]],
};

// Placement per format: [left, top, width] of each piece (px).
const P = {
  feed: {
    brand: [72, 64], h1: [72, 180, 980, 104], sub: [72, null, 500, 34],
    hero: { kid: [470, 400, 630], stage: [390, 430, 780], tile: [56, 820, 520], cta: [72, 1160] },
    earn: { kid: [450, 650, 800], stage: [420, 560, 800], chips: [56, 530, 520], note: [72, 885], cta: [72, 975] },
    hour: { kid: [500, 440, 590], stage: [430, 470, 720], clock: [100, 660], who: [56, 1000, 470], cta: [72, 1180] },
    ai: { kid: [545, 470, 560], stage: [470, 500, 720], verdicts: [56, 650, 430], cta: [72, 1160],
          bell: [1000, 1300, 140], dumbbell: [800, 1302, 200, -4] },
    laptop: { kid: [650, 480, 420], stage: [580, 500, 560], laptop: [36, 640, 620], cta: [72, 1160],
              dumbbells: [[870, 1250, 210, -4, '#ff2e88'], [935, 1305, 230, 3, '#15abcf']] },
    phone: { kid: [470, 610, 620], stage: [420, 540, 700], phone: [84, 600, 250], cta: [72, 1185],
             bottle: [392, 1150, 190], bell: [985, 1300, 120] },
  },
  story: {
    brand: [72, 240], h1: [72, 380, 960, 118], sub: [72, null, 900, 38],
    hero: { kid: [430, 980, 620], stage: [330, 1000, 820], tile: [56, 1130, 560], cta: [72, 1480] },
    earn: { kid: [430, 1250, 650], stage: [380, 1150, 760], chips: [56, 820, 620], note: [72, 1185], cta: [72, 1270] },
    hour: { kid: [470, 780, 640], stage: [360, 820, 820], clock: [90, 980], who: [56, 1340, 560], cta: [72, 1490] },
    ai: { kid: [500, 880, 580], stage: [420, 900, 740], verdicts: [56, 860, 430], cta: [72, 1300],
          bell: [995, 1745, 140], dumbbell: [775, 1752, 200, -4] },
    laptop: { kid: [650, 860, 410], stage: [560, 880, 560], laptop: [36, 860, 640], cta: [72, 1400],
              dumbbells: [[860, 1560, 210, -4, '#ff2e88'], [930, 1615, 230, 3, '#15abcf']] },
    phone: { kid: [520, 1080, 620], stage: [460, 980, 700], phone: [84, 800, 260], cta: [72, 1380],
             bottle: [420, 1330, 190], bell: [1000, 1700, 120] },
  },
}[F];
const Q = P[C];

// ------------------------------------------------------------ the AI banners
const BONES = [[5, 7], [7, 9], [6, 8], [8, 10], [5, 6], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [0, 5], [0, 6]];
const f1 = (v) => Math.round(v * 10) / 10;
const DEFS = `<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6ff"/><stop offset=".5" stop-color="#aab2d0"/><stop offset="1" stop-color="#6c7496"/></linearGradient>
  <linearGradient id="bell" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#7dffbc"/><stop offset=".55" stop-color="#2bff88"/><stop offset="1" stop-color="#12c98a"/></linearGradient>
  <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6eaf8"/><stop offset="1" stop-color="#9aa3c4"/></linearGradient>
  <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26306e"/><stop offset="1" stop-color="#0d1230"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fe3ff" stop-opacity=".85"/><stop offset="1" stop-color="#15abcf" stop-opacity=".9"/></linearGradient>
</defs>`;

// The app's skeleton: neon bones, white joints (points in px, [x, y, c]).
function skeleton(pts, w = 7, r = 8, min = .3) {
  let g = `<g filter="url(#glow)" stroke="#2bff88" stroke-width="${w}" stroke-linecap="round">`;
  for (const [a, b] of BONES) {
    if (pts[a][2] < min || pts[b][2] < min) continue;
    g += `<line x1="${f1(pts[a][0])}" y1="${f1(pts[a][1])}" x2="${f1(pts[b][0])}" y2="${f1(pts[b][1])}"/>`;
  }
  g += '</g>';
  for (const p of pts) if (p[2] >= min) g += `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${r}" fill="#fff" stroke="#2bff88" stroke-width="${r * .45}"/>`;
  return g;
}
// A head round the face joints (nose, eyes, ears) - the drawn figures on
// the screens read better as people with one.
function head(pts, r) {
  const cx = pts.slice(0, 5).reduce((s, p) => s + p[0], 0) / 5, cy = pts.slice(0, 5).reduce((s, p) => s + p[1], 0) / 5;
  return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" fill="none" stroke="#2bff88" stroke-width="${f1(r * .22)}" filter="url(#glow)"/>`;
}
function angleAt(a, b, c) {
  const ax = a[0] - b[0], ay = a[1] - b[1], cx = c[0] - b[0], cy = c[1] - b[1];
  return Math.acos(Math.max(-1, Math.min(1, (ax * cx + ay * cy) / Math.hypot(ax, ay) / Math.hypot(cx, cy)))) * 180 / Math.PI;
}
// A measured angle, as the calibration shows it: "knee 172°".
function tag(x, y, text, anchor = 'start', size = 26) {
  const w = text.length * size * .56 + 30, x0 = anchor === 'end' ? x - w : x;
  return `<g><rect x="${f1(x0)}" y="${f1(y - size * .95)}" width="${f1(w)}" height="${f1(size * 1.45)}" rx="${f1(size * .72)}" fill="rgba(10,13,34,.85)" stroke="#ffe65a" stroke-width="2"/>
    <text x="${f1(x0 + w / 2)}" y="${f1(y + size * .12)}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="${size}" fill="#ffe65a">${text}</text></g>`;
}
// The joints MoveNet found on the boy, where his picture is on the banner.
function kidJoints() {
  const kh = Q.kid[2] * KID[2] / KID[1];
  return KP[KID[0]].map(([x, y, c]) => [Q.kid[0] + x * Q.kid[2], Q.kid[1] + y * kh, c]);
}
// A detection frame around the joints, with its label.
function scanFrame(pts, label) {
  const ok = pts.filter((p) => p[2] >= .3);
  const x0 = f1(Math.min(...ok.map((p) => p[0])) - 70), x1 = f1(Math.max(...ok.map((p) => p[0])) + 70);
  const y0 = f1(Math.min(...ok.map((p) => p[1])) - 110), y1 = f1(Math.max(...ok.map((p) => p[1])) + 60);
  const L = 54;
  return `<g stroke="#2bff88" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M${x0} ${y0 + L} V${y0} H${x0 + L} M${x1 - L} ${y0} H${x1} V${y0 + L} M${x1} ${y1 - L} V${y1} H${x1 - L} M${x0 + L} ${y1} H${x0} V${y1 - L}"/></g>
    <rect x="${x0}" y="${y0 - 52}" width="${f1(label.length * 15 + 34)}" height="40" rx="20" fill="#2bff88"/>
    <text x="${x0 + 17}" y="${y0 - 24}" font-family="Nunito" font-weight="900" font-size="26" fill="#0b2a18">${label}</text>`;
}

// (x, y) its middle.
function dumbbell(x, y, len, rot, color) {
  const plate = (cx, w, h) => `<rect x="${f1(cx - w / 2)}" y="${f1(-h / 2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(w * .35)}" fill="${color}"/>` +
    `<rect x="${f1(cx - w / 2 + w * .18)}" y="${f1(-h / 2 + h * .08)}" width="${f1(w * .22)}" height="${f1(h * .84)}" rx="${f1(w * .1)}" fill="#fff" opacity=".28"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${rot})">
    <ellipse cx="0" cy="${f1(len * .2)}" rx="${f1(len * .55)}" ry="${f1(len * .06)}" fill="#000" opacity=".4" filter="url(#soft)"/>
    <rect x="${f1(-len * .5)}" y="${f1(-len * .035)}" width="${f1(len)}" height="${f1(len * .07)}" rx="${f1(len * .035)}" fill="url(#steel)"/>
    ${plate(-len * .3, len * .13, len * .42)}${plate(len * .3, len * .13, len * .42)}
    ${plate(-len * .42, len * .1, len * .3)}${plate(len * .42, len * .1, len * .3)}
    <rect x="${f1(-len * .2)}" y="${f1(-len * .045)}" width="${f1(len * .4)}" height="${f1(len * .09)}" rx="${f1(len * .045)}" fill="#3a4170"/></g>`;
}
// The logo's kettlebell; (x, y) the middle of its foot.
function kettlebell(x, y, h) {
  const r = h * .36, cy = y - r * .98, hx = f1(x - r * .45), hy = f1(cy - r * .3);
  return `<g><ellipse cx="${x}" cy="${y + 4}" rx="${f1(r * 1.2)}" ry="${f1(r * .22)}" fill="#000" opacity=".4" filter="url(#soft)"/>
    <path d="M${f1(x - r * .55)} ${f1(cy - r * .55)} V${f1(cy - r * 1.05)} Q${f1(x - r * .55)} ${f1(cy - r * 1.6)} ${x} ${f1(cy - r * 1.6)} Q${f1(x + r * .55)} ${f1(cy - r * 1.6)} ${f1(x + r * .55)} ${f1(cy - r * 1.05)} V${f1(cy - r * .55)}"
          fill="none" stroke="#e6eaf8" stroke-width="${f1(r * .26)}" stroke-linecap="round"/>
    <path d="M${f1(x - r * .45)} ${y} A${f1(r)} ${f1(r)} 0 1 1 ${f1(x + r * .45)} ${y} Z" fill="url(#bell)"/>
    <ellipse cx="${hx}" cy="${hy}" rx="${f1(r * .28)}" ry="${f1(r * .15)}" transform="rotate(-42 ${hx} ${hy})" fill="#fff" opacity=".35"/></g>`;
}
// (x, y) the middle of its bottom.
function bottle(x, y, h) {
  const w = h * .34;
  return `<g><ellipse cx="${x}" cy="${y + 3}" rx="${f1(w * .8)}" ry="${f1(w * .16)}" fill="#000" opacity=".4" filter="url(#soft)"/>
    <rect x="${f1(x - w / 2)}" y="${f1(y - h * .86)}" width="${f1(w)}" height="${f1(h * .86)}" rx="${f1(w * .3)}" fill="url(#water)"/>
    <rect x="${f1(x - w / 2)}" y="${f1(y - h * .58)}" width="${f1(w)}" height="${f1(h * .2)}" fill="#fff" opacity=".85"/>
    <rect x="${f1(x - w * .3)}" y="${f1(y - h)}" width="${f1(w * .6)}" height="${f1(h * .16)}" rx="${f1(w * .1)}" fill="#ff2e88"/>
    <rect x="${f1(x - w * .32)}" y="${f1(y - h * .8)}" width="${f1(w * .12)}" height="${f1(h * .55)}" rx="${f1(w * .06)}" fill="#fff" opacity=".4"/></g>`;
}

// A synthetic pose (synth.js: frame-normalized, x on a 16:9 frame) drawn
// with true proportions, `height` tall and centred on (cx, cy).
function poseFit(pose, cx, cy, height) {
  const u = pose.map((j) => [j.x * 16 / 9, j.y, j.c]);
  const xs = u.map((p) => p[0]), ys = u.map((p) => p[1]);
  const k = height / (Math.max(...ys) - Math.min(...ys));
  const mx = (Math.max(...xs) + Math.min(...xs)) / 2, my = (Math.max(...ys) + Math.min(...ys)) / 2;
  return u.map(([px, py, c]) => [cx + (px - mx) * k, cy + (py - my) * k, c]);
}

// The lock screen on a laptop: the camera's view mid-squat, as the AI sees it.
function laptop(x, y, w) {
  const sw = w * .86, sh = sw * .6, sx = x + (w - sw) / 2, b = 16;
  const cx = sx + b, cy = y + b, cw = sw - 2 * b, ch = sh - 2 * b;
  const pts = poseFit(EUSynth.squatPose(98), cx + cw * .6, cy + ch * .56, ch * .74);
  const knee = angleAt(pts[11], pts[13], pts[15]);
  const sc = S.screen;
  return `<g>
    <ellipse cx="${f1(x + w / 2)}" cy="${f1(y + sh + w * .05)}" rx="${f1(w * .52)}" ry="${f1(w * .035)}" fill="#000" opacity=".45" filter="url(#soft)"/>
    <rect x="${f1(sx)}" y="${y}" width="${f1(sw)}" height="${f1(sh)}" rx="20" fill="#171b30" stroke="#3a4170" stroke-width="3"/>
    <svg x="${f1(cx)}" y="${f1(cy)}" width="${f1(cw)}" height="${f1(ch)}" viewBox="${f1(cx)} ${f1(cy)} ${f1(cw)} ${f1(ch)}" overflow="hidden">
      <rect x="${f1(cx)}" y="${f1(cy)}" width="${f1(cw)}" height="${f1(ch)}" fill="url(#scr)"/>
      ${head(pts, ch * .07)}${skeleton(pts, 6, 7)}
      ${tag(pts[13][0] + 26, pts[13][1] + 8, `${sc.knee} ${Math.round(knee)}°`, 'start', 22)}
      <rect x="${f1(cx + 18)}" y="${f1(cy + 18)}" width="232" height="100" rx="18" fill="rgba(10,13,34,.85)" stroke="rgba(255,255,255,.15)" stroke-width="2"/>
      <image href="../branding/app-icon.svg" x="${f1(cx + 30)}" y="${f1(cy + 30)}" width="34" height="34"/>
      <text x="${f1(cx + 72)}" y="${f1(cy + 55)}" font-family="Nunito" font-weight="900" font-size="20" fill="#fff">Exercise Unlock</text>
      <text x="${f1(cx + 30)}" y="${f1(cy + 102)}" font-family="Nunito" font-weight="900" font-size="34" fill="#2bff88">3</text>
      <text x="${f1(cx + 58)}" y="${f1(cy + 100)}" font-family="Nunito" font-weight="800" font-size="21" fill="#c4cbf2">${sc.squats}</text>
      <g transform="translate(${f1(pts[0][0] + 40)} ${f1(pts[0][1] - 30)})"><rect x="0" y="-30" width="78" height="46" rx="23" fill="#2bff88"/>
        <text x="39" y="3" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="30" fill="#0b2a18">+1</text></g>
    </svg>
    <circle cx="${f1(sx + sw / 2)}" cy="${f1(y + 8)}" r="5" fill="#2bff88" filter="url(#glow)"/>
    <path d="M${f1(x)} ${f1(y + sh)} H${f1(x + w)} L${f1(x + w - w * .03)} ${f1(y + sh + w * .045)} H${f1(x + w * .03)} Z" fill="url(#alu)"/>
    <rect x="${f1(x + w / 2 - w * .09)}" y="${f1(y + sh)}" width="${f1(w * .18)}" height="${f1(w * .012)}" rx="4" fill="#8a93b8"/></g>`;
}

// The phone page (relay/public) counting squats.
function phone(x, y, w) {
  const h = w * 2.05, b = w * .055, sx = x + b, sy = y + b, sw = w - 2 * b, shh = h - 2 * b;
  const vid = shh * .7, pts = poseFit(EUSynth.squatPose(100), sx + sw * .5, sy + vid * .58, vid * .6);
  const sc = S.screen;
  const counter = (cx, n, label) => `<rect x="${f1(cx)}" y="${f1(sy + vid + 20)}" width="${f1(sw * .92)}" height="${f1(shh * .12)}" rx="12" fill="#283058"/>
    <text x="${f1(cx + 16)}" y="${f1(sy + vid + 20 + shh * .09)}" font-family="Nunito" font-weight="900" font-size="${f1(w * .13)}" fill="#2bff88">${n}</text>
    <text x="${f1(cx + 16 + w * .12)}" y="${f1(sy + vid + 20 + shh * .083)}" font-family="Nunito" font-weight="800" font-size="${f1(w * .07)}" fill="#c4cbf2">${label}</text>`;
  return `<g>
    <ellipse cx="${f1(x + w / 2)}" cy="${f1(y + h + 6)}" rx="${f1(w * .62)}" ry="${f1(w * .07)}" fill="#000" opacity=".45" filter="url(#soft)"/>
    <rect x="${x}" y="${y}" width="${w}" height="${f1(h)}" rx="${f1(w * .16)}" fill="#11142a" stroke="#4a5288" stroke-width="4"/>
    <svg x="${f1(sx)}" y="${f1(sy)}" width="${f1(sw)}" height="${f1(shh)}" viewBox="${f1(sx)} ${f1(sy)} ${f1(sw)} ${f1(shh)}" overflow="hidden">
      <rect x="${f1(sx)}" y="${f1(sy)}" width="${f1(sw)}" height="${f1(shh)}" fill="#1f2547"/>
      <rect x="${f1(sx)}" y="${f1(sy)}" width="${f1(sw)}" height="${f1(vid)}" fill="#05060f"/>
      ${head(pts, vid * .045)}${skeleton(pts, 4, 5)}
      <rect x="${f1(sx + sw * .05)}" y="${f1(sy + 34)}" width="${f1(sw * .9)}" height="34" rx="17" fill="rgba(20,120,70,.85)"/>
      <text x="${f1(sx + sw / 2)}" y="${f1(sy + 57)}" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="${f1(w * .05)}" fill="#fff">${sc.banner}</text>
      ${counter(sx + sw * .04, 6, sc.squats)}
      <rect x="${f1(sx + sw * .04)}" y="${f1(sy + vid + 36 + shh * .12)}" width="${f1(sw * .92)}" height="10" rx="5" fill="#3c4677"/>
      <rect x="${f1(sx + sw * .04)}" y="${f1(sy + vid + 36 + shh * .12)}" width="${f1(sw * .92 * .75)}" height="10" rx="5" fill="#2bff88"/>
    </svg>
    <rect x="${f1(x + w * .38)}" y="${f1(y + b * .35)}" width="${f1(w * .24)}" height="${f1(b * .5)}" rx="${f1(b * .25)}" fill="#05060f"/></g>`;
}

// What goes over the boy: skeleton, frame, measured angles, the gear.
function props() {
  let g = '';
  if (C === 'ai') {
    const pts = kidJoints();
    g += scanFrame(pts, S.scan) + skeleton(pts);
    const knee = angleAt(pts[12], pts[14], pts[16]), elbow = angleAt(pts[6], pts[8], pts[10]);
    g += tag(pts[14][0] - 26, pts[14][1] + 8, `${S.knee} ${Math.round(knee)}°`, 'end');
    g += tag(pts[8][0] - 26, pts[8][1] + 8, `${S.elbow} ${Math.round(elbow)}°`, 'end');
    g += kettlebell(...Q.bell) + dumbbell(...Q.dumbbell, '#ff2e88');
  }
  if (C === 'laptop') {
    g += laptop(...Q.laptop);
    g += skeleton(kidJoints(), 5, 6);
    for (const d of Q.dumbbells) g += dumbbell(...d);
  }
  if (C === 'phone') {
    g += phone(...Q.phone) + bottle(...Q.bottle) + kettlebell(...Q.bell);
  }
  return g;
}

const el = document.getElementById('ad');
el.className = 'ad ' + F;
const H = F === 'feed' ? 1350 : 1920;
let html = `
  <div class="blob" style="left:620px;top:${F === 'feed' ? -120 : 80}px;width:520px;height:520px;background:var(--pink);opacity:.35"></div>
  <div class="blob" style="left:-180px;top:${H - 520}px;width:560px;height:560px;background:var(--cyan);opacity:.30"></div>
  <div class="blob" style="left:${Q.stage[0] + 120}px;top:${Q.stage[1] + 160}px;width:${Q.stage[2] - 240}px;height:${Q.stage[2] - 240}px;background:var(--neon);opacity:.14"></div>
  <div class="stage" style="left:${Q.stage[0]}px;top:${Q.stage[1]}px;width:${Q.stage[2]}px;height:${Q.stage[2]}px"></div>`;

const kidH = Q.kid[2] * KID[2] / KID[1];
html += `<div class="floor" style="left:${Q.kid[0] + Q.kid[2] * .12}px;top:${Q.kid[1] + kidH - 46}px;width:${Q.kid[2] * .76}px;height:80px"></div>`;
html += `<img class="kid" src="assets/${KID[0]}.webp" style="left:${Q.kid[0]}px;top:${Q.kid[1]}px;width:${Q.kid[2]}px">`;
if (['ai', 'laptop', 'phone'].includes(C)) html += `<svg class="layer" width="1080" height="${H}">${DEFS}${props()}</svg>`;

html += `<div class="brand" style="left:${P.brand[0]}px;top:${P.brand[1]}px"><img src="../branding/app-icon.svg"><div><b>Exercise Unlock</b><small>${T.platform}</small></div></div>`;
html += `<h1 id="h1" style="left:${P.h1[0]}px;top:${P.h1[1]}px;width:${P.h1[2]}px;font-size:${P.h1[3]}px">${S.h.join('<br>')}</h1>`;
html += `<p class="sub" id="sub" style="left:${P.sub[0]}px;width:${P.sub[2]}px;font-size:${P.sub[3]}px">${S.sub}</p>`;

if (C === 'ai') {
  html += `<div class="verdicts" style="left:${Q.verdicts[0]}px;top:${Q.verdicts[1]}px;width:${Q.verdicts[2]}px">` +
    S.verdicts.map(([kind, what, why]) => `<div class="verdict"><i style="background:${kind === 'ok' ? 'var(--neon)' : '#ff4d6a'}">${kind === 'ok' ? '✓' : '✕'}</i>` +
      `<div><b>${what}</b><span style="color:${kind === 'ok' ? 'var(--neon)' : '#ff8fa0'}">${why}</span></div></div>`).join('') + '</div>';
}
if (C === 'hero') {
  const t = S.tile;
  html += `<div class="tile" style="left:${Q.tile[0]}px;top:${Q.tile[1]}px;width:${Q.tile[2]}px">
    <div class="top"><img src="../branding/app-icon.svg">Exercise Unlock</div>
    <div class="rows"><div class="cnt"><b>4</b><span>${t.squats}</span></div><div class="cnt"><b>1</b><span>${t.push}</span></div></div>
    <div class="bar"><i></i></div><div class="ok">${t.ok}</div></div>`;
}
if (C === 'earn') {
  html += `<div class="chips" style="left:${Q.chips[0]}px;top:${Q.chips[1]}px;width:${Q.chips[2]}px">` +
    S.chips.map(([icon, what, min]) => `<div class="chip"><div class="dot" style="background:${DOT[icon]}">${ICON[icon]}</div>` +
                                       `<span class="what">${what}</span><span class="min">${min}</span></div>`).join('') + '</div>';
  html += `<p class="note" style="left:${Q.note[0]}px;top:${Q.note[1]}px">${S.note}</p>`;
}
if (C === 'hour') {
  // 60 of 60 minutes: a full ring, its last 5 minutes (the reminder) in yellow.
  const r = 130, len = 2 * Math.PI * r;
  html += `<div class="clock" style="left:${Q.clock[0]}px;top:${Q.clock[1]}px">
    <svg viewBox="0 0 300 300" width="300" height="300"><circle cx="150" cy="150" r="${r}" fill="rgba(10,13,34,.6)" stroke="#3c4677" stroke-width="22"/>
      <circle cx="150" cy="150" r="${r}" fill="none" stroke="var(--neon)" stroke-width="22" stroke-linecap="round"
              stroke-dasharray="${len * 55 / 60 - 8} ${len}" transform="rotate(-90 150 150)"/>
      <circle cx="150" cy="150" r="${r}" fill="none" stroke="var(--yellow)" stroke-width="22" stroke-linecap="round"
              stroke-dasharray="${len * 5 / 60 - 14} ${len}" transform="rotate(${-90 + 330 + 4} 150 150)"/></svg>
    <div class="num"><div><b>${S.clock[0]}</b><span>${S.clock[1]}</span></div></div></div>`;
  html += `<p class="who" style="left:${Q.who[0]}px;top:${Q.who[1]}px;width:${Q.who[2]}px">${S.who}</p>`;
}
html += `<div class="cta" style="left:${Q.cta[0]}px;top:${Q.cta[1]}px"><span class="pill">${T.button} <span>→</span></span><span class="url">${T.url}</span></div>`;
el.innerHTML = html;

// Each headline line stays one line (smaller type when it has to), and the
// subtitle sits right under it - measured in the loaded font.
function placeSub() {
  const h1 = document.getElementById('h1');
  h1.style.whiteSpace = 'nowrap';
  let size = P.h1[3];
  h1.style.fontSize = size + 'px';
  while (h1.scrollWidth > h1.clientWidth && size > 60) h1.style.fontSize = (size -= 2) + 'px';
  document.getElementById('sub').style.top = (h1.offsetTop + h1.offsetHeight + (F === 'feed' ? 26 : 34)) + 'px';
}
placeSub();
window.bannerReady = Promise.all([document.fonts.ready,
  ...[...document.images].map((im) => im.complete ? Promise.resolve() : new Promise((r) => { im.onload = im.onerror = r; }))])
  .then(placeSub);
</script>
