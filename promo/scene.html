<!doctype html>
<!--
  Exercise Unlock — promo animation.
  Every frame is a pure function of time: render(t) rebuilds the SVG.
  build.py injects the narration timeline (setTimeline) and grabs frames;
  opened directly in a browser it plays a silent preview with a scrubber.
-->
<html>
<head>
<meta charset="utf-8">
<title>Exercise Unlock — promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #11131f; overflow: hidden; }
  svg { display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
        padding: 10px 16px; background: rgba(0,0,0,.55); color: #fff; font: 14px system-ui; }
  #ui input { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0.0</span></div>

let L = I18N.en;
function setLang(lang) {
  L = I18N[lang] || I18N.en;
  FONT_H = `${L.font}, 'Segoe UI', sans-serif`;
  H_WEIGHT = L.hw;
}

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp  = (a, b, t) => a + (b - a) * t;
const seg   = (t, a, b) => clamp((t - a) / (b - a));
const eOut  = t => 1 - Math.pow(1 - t, 3);
const eIO   = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const f  = v => Math.round(v * 10) / 10;
const f3 = v => Math.round(v * 1000) / 1000;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mid = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
// angle convention: degrees from "up", clockwise positive (90 = right, 180 = down)
const mv = (p, len, a) => { const r = a * Math.PI / 180; return { x: p.x + len * Math.sin(r), y: p.y - len * Math.cos(r) }; };
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; };

// ---------------------------------------------------------------- timeline
let TL = null;
function defaultTimeline() {
  const d = [['intro',6],['sitting',10.5],['how',10.5],['ai',10.5],['earn',11],['hour',18],
             ['health',20],['parents',14],['privacy',10],['outro',8]];
  let t = 0;
  return { scenes: d.map(([id, dur]) => { const s = { id, start: t, dur, cues: [] }; t += dur; return s; }), total: t };
}
function setTimeline(tl) { TL = tl; }
// Scene-local time of a named moment in the narration (build.py maps each
// mark to the word that says it, per language); fallback for the preview.
function mark(S, name, fallback) { return S.marks && S.marks[name] != null ? S.marks[name] : fallback; }

// ---------------------------------------------------------------- primitives
function txt(x, y, s, size, o = {}) {
  const { fill = C.ink, anchor = 'middle', family = FONT_H, op = 1 } = o;
  const weight = o.weight ?? (family === FONT_H ? H_WEIGHT : 700);
  return `<text x="${f(x)}" y="${f(y)}" font-family="${family}" font-weight="${weight}" font-size="${size}" fill="${fill}" text-anchor="${anchor}"${op < 1 ? ` opacity="${f3(op)}"` : ''}>${s}</text>`;
}
function ln(a, b, w, c, extra = '') {
  return `<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
}
function ci(p, r, c, extra = '') { return `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${r}" fill="${c}" ${extra}/>`; }
function pop(lt, t0, cx, cy, inner, dur = .45) {
  const k = eBack(seg(lt, t0, t0 + dur));
  if (lt < t0) return '';
  return `<g transform="translate(${f(cx)} ${f(cy)}) scale(${f3(k)}) translate(${f(-cx)} ${f(-cy)})" opacity="${f3(seg(lt, t0, t0 + dur * .5))}">${inner}</g>`;
}
function headline(lt, html, o = {}) {
  const { x = 960, y = 150, size = 70, delay = .1, anchor = 'middle', fill = C.ink } = o;
  const a = eOut(seg(lt, delay, delay + .55));
  return `<g opacity="${f3(a)}" transform="translate(0 ${f((1 - a) * 26)})">${txt(x, y, html, size, { anchor, fill })}</g>`;
}
function floor(y, op = .55) { return `<rect x="0" y="${y}" width="1920" height="${1080 - y}" fill="#DCE4FF" opacity="${op}"/>`; }
function shadowEl(x, y, rx, ry) { return `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${C.ink}" opacity=".12"/>`; }
function card(x, y, w, h, r = 28, fill = '#fff') {
  return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${r}" fill="${fill}" filter="url(#shadow)"/>`;
}

function icon(name, cx, cy, size, c) {
  return `<g transform="translate(${f(cx - size / 2)} ${f(cy - size / 2)}) scale(${f3(size / 100)})">${ICONS[name](c)}</g>`;
}
function padlock(cx, cy, size, k, c = '#fff', hole = C.indigo) {
  const lift = (1 - k) * 22;
  return `<g transform="translate(${f(cx - size / 2)} ${f(cy - size / 2)}) scale(${f3(size / 100)})">
    <path d="M32 ${f(50 - lift)} V${f(34 - lift)} A18 18 0 0 1 68 ${f(34 - lift)} V${f(50 - lift)}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round"/>
    <rect x="16" y="44" width="68" height="50" rx="13" fill="${c}"/>
    <circle cx="50" cy="64" r="8" fill="${hole}"/><rect x="46.5" y="66" width="7" height="15" rx="3" fill="${hole}"/></g>`;
}
function logo(size) {

    <rect width="100" height="100" rx="26" fill="url(#gLogo)"/>
    <path d="M35 46 V34 A15 15 0 0 1 65 34 V46" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <rect x="23" y="43" width="54" height="42" rx="11" fill="#fff"/>
    <g transform="translate(33 52) scale(.34)">${ICONS.dumbbell(C.indigo)}</g></g>`;
}

// ---------------------------------------------------------------- the kid (side view, facing right)
function poseSquat(k) {                       // k: 0 standing .. 1 deep squat
  const ankle = { x: 0, y: -16 };
  const knee = mv(ankle, LEN.shin, 32 * k);
  const hip = mv(knee, LEN.thigh, -82 * k);
  const sh = mv(hip, LEN.torso, 36 * k);
  const el = mv(sh, LEN.ua, lerp(172, 95, k));
  const wr = mv(el, LEN.fa, lerp(165, 88, k));
  const headA = lerp(0, 16, k);
  return { ankle, knee, hip, sh, el, wr, head: mv(sh, LEN.neck + LEN.R, headA), headA, foot: { x: 30, y: -14 } };
}
function poseCheer(k, bounce = 0) {           // arms up
  const p = poseSquat(bounce);
  p.el = mv(p.sh, LEN.ua, lerp(172, 52, k));          // front arm: forward-up, clear of the face
  p.wr = mv(p.el, LEN.fa, lerp(165, 4, k));
  p.back = { el: mv(p.sh, LEN.ua, lerp(172, -38, k)) };  // back arm: up and behind
  p.back.wr = mv(p.back.el, LEN.fa, lerp(165, -12, k));
  return p;
}
function ik(a, b, l1, l2, side) {
  const dx = b.x - a.x, dy = b.y - a.y; const d = Math.min(Math.hypot(dx, dy), l1 + l2 - .01);
  const A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const t = Math.atan2(dy, dx) + side * A;
  return { x: a.x + l1 * Math.cos(t), y: a.y + l1 * Math.sin(t) };
}

const DONE = .97;

function repK(reps, lt) {
  for (const r of reps) if (lt >= r.s && lt <= r.s + r.d) return r.depth * (1 - Math.cos(2 * Math.PI * (lt - r.s) / r.d)) / 2;
  return 0;
}
function repCount(reps, lt) { let n = 0; for (const r of reps) if (r.counts !== false && lt >= tcOf(r)) n++; return n; }
function lastCount(reps, lt) { let t = null; for (const r of reps) if (r.counts !== false && lt >= tcOf(r)) t = tcOf(r); return t; }
function floaters(reps, lt, x, y, label, color = C.mint) {

  g += txt(1470, 450, L.hm(H, String(M).padStart(2, '0')), 46, { fill: C.coral, op: seg(lt, .8, 1.2) });
  // chair, desk, laptop
  const hx = 700, hy = 690, s = 1.3;
  g += `<rect x="${hx - 98}" y="${hy - 160}" width="24" height="230" rx="12" fill="#7C88E8"/><rect x="${hx - 92}" y="${hy + 30}" width="160" height="20" rx="10" fill="#7C88E8"/>
        <rect x="${hx - 84}" y="${hy + 50}" width="14" height="${gy - hy - 50}" fill="#6672D6"/><rect x="${hx + 46}" y="${hy + 50}" width="14" height="${gy - hy - 50}" fill="#6672D6"/>`;
  g += `<rect x="840" y="640" width="640" height="24" rx="10" fill="#D9A066"/><rect x="866" y="664" width="22" height="${gy - 664}" fill="#C08850"/><rect x="1434" y="664" width="22" height="${gy - 664}" fill="#C08850"/>`;
  const sl = eIO(seg(lt, .6, 6));

  g += `<polygon points="1092,620 1134,452 830,400 830,600" fill="url(#gBeam)" opacity="${f3(.5 + .15 * Math.sin(lt * 6))}"/>`;
  if (lt > 4) for (let i = 0; i < 3; i++) {
    const p = ((lt - 4) * .6 + i / 3) % 1;
    g += txt(860 + p * 60, 470 - p * 120, 'z', 34 + i * 6, { fill: C.indigo, op: Math.sin(Math.PI * p) });
  }
  [['spine', L.posture, mark(S, 'posture', 5)], ['battery', L.energy, mark(S, 'energy', 6)], ['zzz', L.focus, mark(S, 'focus', 7)]].forEach(([ic, label, t0], i) => {
    const y = 300 + i * 112;
    g += pop(lt, t0, 310, y, badge(120, y - 46, 390, 92, ic, label, C.coral));
  });
  return g;
}

function sHow(lt, S) {
  const P = PLAN.how(S);
  let g = floor(905) + headline(lt, L.how(C.coral));
  const strike = eIO(seg(lt, P.tPw, P.tPw + .45));
  const pwA = 1 - seg(lt, P.tPw + .7, P.tPw + 1);
  const tileK = eBack(seg(lt, P.tPw + .9, P.tPw + 1.4));
  const sq = repCount(P.reps, lt);
  g += laptop(1190, 545, 820, scrLock({ time: '19:30', pwA, strike, tileK, sq, pu: 0, earned: `${sq * 3}:00`, ready: sq * 3 >= 10 }));
  const k = repK(P.reps, lt);
  g += shadowEl(450, 905, 110, 18) + drawKid(poseSquat(k), 430, 905, 1.45, k > .5 ? 'effort' : 'happy');
  g += floaters(P.reps, lt, 470, 255, L.plusMin(3));
  return g;
}

function sAI(lt, S) {
  const P = PLAN.ai(S);
  let g = floor(930) + headline(lt, L.ai);
  const lx = 1500, ly = 540, lw = 540, cam = camPoint(lx, ly, lw);
  const sq = repCount(P.reps, lt), ca = seg(lt, .2, .8);
  g += `<polygon points="${f(cam.x)},${f(cam.y)} 450,300 450,960" fill="url(#gCone)" opacity="${f3(.55 * ca)}"/>`;
  g += ln(cam, { x: 450, y: 300 + 660 * (.5 + .5 * Math.sin(lt * 2.4)) }, 3, C.neon, `opacity="${f3(.6 * ca)}"`);
  g += laptop(lx, ly, lw, scrLock({ time: '19:31', tileK: 1, sq, pu: 0, earned: `${sq * 3}:00`, ready: sq * 3 >= 10 }), { camOn: true });
  const k = repK(P.reps, lt), J = poseSquat(k), kx = 700, ky = 930, ks = 1.5;
  const skel = seg(lt, P.tAI, P.tAI + .5);
  g += shadowEl(kx + 20, ky, 120, 20) + drawKid(J, kx, ky, ks, k > .5 ? 'effort' : 'happy', { skel });
  if (skel > 0) {
    const kn = { x: kx + J.knee.x * ks, y: ky + J.knee.y * ks };
    g += `<g opacity="${f3(skel)}">${pill(kn.x + 120, kn.y - 30, L.knee(Math.round(angleAt(J.hip, J.knee, J.ankle))), { w: 210, h: 54, size: 26, color: C.ink })}</g>`;
  }
  const lc = lastCount(P.reps, lt), bump = lc != null ? 1 + .22 * Math.max(0, 1 - (lt - lc) / .35) : 1;
  g += `<g transform="translate(${lx} 262) scale(${f3(bump)}) translate(${-lx} -262)">${pill(lx, 262, L.counter(sq), { w: L.counterW, h: 78, size: 38, ic: 'check', color: C.ink })}</g>`;
  g += floaters(P.reps, lt, kx + 60, 250, '+1');
  const na = seg(lt, P.tH + .3, P.tH + .55) * (1 - seg(lt, P.tH + 2, P.tH + 2.3));
  if (na > 0) g += `<g opacity="${f3(na)}">${pill(kx + 60, 252, L.shallow, { w: L.shallowW, h: 72, size: 30, ic: 'cross', icColor: C.red, color: C.red })}</g>`;
  return g;
}

function sEarn(lt, S) {
  const P = PLAN.earn(S);
  let g = floor(880) + headline(lt, L.earn);
  const n = repCount(P.reps, lt), done = n >= P.reps.length;
  const lc = lastCount(P.reps, lt);
  const fm = lc == null ? 0 : lerp(Math.max(0, n - 1) * 6, n * 6, eOut(clamp((lt - lc) / .45)));
  const k = done ? 0 : repK(P.reps, lt);
  g += shadowEl(450, 880, 260, 18) + drawKid(posePush(k), 230, 880, 1.3, done ? 'joy' : (k > .5 ? 'effort' : 'happy'));
  const bx = 1000, bw = 760, by = 470, bh = 76;
  g += txt(bx, 425, L.earnedTime, 42, { anchor: 'start' }) + txt(bx + bw, 425, `${Math.floor(fm)}:00 <tspan fill="${C.muted}" font-size="34">/ 60:00</tspan>`, 56, { anchor: 'end', fill: C.indigo });
  g += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${bh / 2}" fill="${C.line}"/>`;
  if (fm > 0) g += `<rect x="${bx}" y="${by}" width="${f(Math.max(bh, bw * fm / 60))}" height="${bh}" rx="${bh / 2}" fill="url(#gFill)"/>`;
  const tx = bx + bw * 10 / 60;
  g += ln({ x: tx, y: by - 14 }, { x: tx, y: by + bh + 14 }, 4, C.ink, 'stroke-dasharray="2 10" opacity=".55"') + txt(tx, by + bh + 52, L.unlockFrom, 26, { family: FONT_B, weight: 800, fill: C.muted });
  P.reps.forEach((r, i) => {
    const p = (lt - tcOf(r)) / .7;
    if (p < 0 || p > 1) return;
    const e = eIO(p), sx = 700, sy = 640, ex = bx + bw * Math.min(60, (i + 1) * 6) / 60 - 30, ey = by + bh / 2;
    const x = lerp(lerp(sx, (sx + ex) / 2, e), lerp((sx + ex) / 2, ex, e), e), y = lerp(lerp(sy, 230, e), lerp(230, ey, e), e);
    g += `<g opacity="${f3(1 - Math.pow(p, 4))}">${pill(x, y, L.plusMin(6), { w: 160, h: 54, size: 28, fill: C.coral, color: '#fff' })}</g>`;
  });
  g += pop(lt, tcOf(P.reps[1]) + .45, bx + L.readyW / 2, 660, pill(bx + L.readyW / 2, 660, L.ready, { w: L.readyW, h: 76, size: L.readySize, ic: 'check', color: C.ink }));
  g += pop(lt, tcOf(P.reps[9]) + .45, bx + bw - L.maxW / 2, 770, pill(bx + bw - L.maxW / 2, 770, L.max, { w: L.maxW, h: 76, size: 32, ic: 'timer', icColor: C.coral, color: C.ink }));
  if (done) g += confetti(lt - tcOf(P.reps[9]), 40, seg(lt, tcOf(P.reps[9]), tcOf(P.reps[9]) + .3));
  return g;
}

function cycleDiagram(t) {
  let g = `<rect width="1920" height="1080" fill="#F3F1FF" opacity="${f3(.9 * seg(t, -.3, .3))}"/>`;
  g += headline(t + .1, L.cycle(C.coral), { y: 250, size: 76 });
  const xs = [360, 760, 1160, 1560], cy = 560;
  xs.forEach((x, i) => {
    const t0 = .15 + i * .25;
    if (i > 0) { const a = seg(t, t0 - .1, t0 + .2); g += `<g opacity="${f3(a)}">${ln({ x: xs[i - 1] + 140, y: cy }, { x: x - 150, y: cy }, 8, C.coral)}<path d="M${x - 166} ${cy - 16} L${x - 146} ${cy} L${x - 166} ${cy + 16}" stroke="${C.coral}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`; }
    let inner = `<circle cx="${x}" cy="${cy}" r="120" fill="#fff" filter="url(#shadow)"/>`;
    if (i % 2 === 0) inner += laptop(x, cy - 8, 150, scrGame(t + i)) + txt(x, cy + 175, L.play, 34);
    else inner += drawKid(poseSquat((1 - Math.cos(t * 3.6 + i)) / 2), x - 12, cy + 88, .42, 'effort') + txt(x, cy + 175, L.move, 34, { fill: C.coral });
    g += pop(t, t0, x, cy, inner);
  });
  const la = seg(t, 1.2, 1.6);
  g += `<path d="M1560 790 Q960 960 360 790" stroke="${C.indigo}" stroke-width="6" fill="none" stroke-dasharray="14 14" opacity="${f3(la)}"/>` +
       `<path d="M384 772 L358 790 L388 806" stroke="${C.indigo}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${f3(la)}"/>` +
       txt(960, 920, L.repeat, 30, { family: FONT_B, weight: 800, fill: C.indigo, op: la });
  return g;
}

function sHour(lt, S) {
  const P = PLAN.hour(S);
  let m = headline(lt, L.hour);
  let rem = 60;
  if (lt >= P.t60) rem = lerp(60, 5, eIO(seg(lt, P.t60, P.tFive)));
  if (lt >= P.tFive) rem = lerp(5, 0, seg(lt, P.tFive + .2, P.tLock));
  const n = repCount(P.reps, lt), lc = lastCount(P.reps, lt);
  if (lt >= P.tLock && lc != null) rem = 60 * lerp(Math.max(0, n - 1), n, eOut(clamp((lt - lc) / .6))) / P.reps.length;
  const col = rem > 20 ? C.mint : rem > 6 ? mix(C.yellow, C.mint, (rem - 6) / 14) : mix(C.coral, C.yellow, rem / 6);
  const cx = 560, cy = 545;
  m += pop(lt, .4, cx, cy, ring(cx, cy, 200, rem / 60, col));
  const locked = lt >= P.tLock && n === 0;
  if (lt >= .4) {
    if (locked) m += padlock(cx, cy, 170, eOut(seg(lt, P.tLock, P.tLock + .3)), C.coral, '#fff');
    else {
      const mm = Math.floor(rem), ss = Math.floor((rem - mm) * 60);
      m += txt(cx, cy + 22, `${mm}:${String(ss).padStart(2, '0')}`, 104, { op: seg(lt, .5, .9) }) +
           txt(cx, cy + 82, n >= P.reps.length ? L.newSession : L.minutesLeft, 32, { family: FONT_B, weight: 800, fill: n >= P.reps.length ? C.mint : C.muted, op: seg(lt, .5, .9) });
    }
  }
  const scr = lt < P.tLock ? scrGame(lt) : scrLock({ time: '18:31', tileK: 1, sq: n, pu: 0, earned: `${n * 3}:00`, ready: n >= P.reps.length });
  m += laptop(1450, 420, 540, scr);
  const tin = eOut(seg(lt, P.tFive, P.tFive + .45)), tout = eIO(seg(lt, P.tLock + .3, P.tLock + .8));
  if (tin > 0 && tout < 1) m += toast(1160 + (1 - tin) * 800 + tout * 800, 720);
  const ka = eOut(seg(lt, P.tBack - .8, P.tBack - .3));
  if (ka > 0) { const k = repK(P.reps, lt); m += `<g opacity="${f3(ka)}" transform="translate(${f((1 - ka) * 220)} 0)">${shadowEl(1020, 935, 95, 16)}${drawKid(poseSquat(k), 1000, 935, 1.15, k > .5 ? 'effort' : 'happy')}</g>`; m += floaters(P.reps, lt, 1030, 430, '+1'); }
  const dim = 1 - eIO(seg(lt, P.tGuar - .3, P.tGuar + .3));
  let g = `<g opacity="${f3(Math.max(dim, .0))}">${floor(935)}${m}</g>`;
  if (lt > P.tGuar - .3) g += cycleDiagram(lt - P.tGuar);
  return g;
}

       txt(150, 502, L.who, 28, { anchor: 'start', family: FONT_B, weight: 700, fill: C.muted }));
  const items = [['dumbbell', C.indigo], ['sun', C.yellow], ['bulb', C.mint], ['clock', C.coral]].map((a, i) => a.concat(L.cards[i]));
  items.forEach(([ic, col, l1, l2], i) => {
    const x = 990 + (i % 2) * 420, y = 270 + Math.floor(i / 2) * 290, cx = x + 190, cy = y + 120;
    g += pop(lt, P.cards[i], cx, cy, card(x, y, 380, 240) + `<circle cx="${x + 80}" cy="${y + 80}" r="50" fill="${col}" opacity=".16"/>` + icon(ic, x + 80, y + 80, 64, col) +
         txt(x + 40, y + 175, l1, L.cardSize, { anchor: 'start' }) + txt(x + 40, y + 218, l2, 34, { anchor: 'start', family: FONT_B, weight: 800, fill: C.muted }));
  });
  const k = repK(P.reps, lt);
  g += shadowEl(480, 990, 100, 18) + drawKid(poseSquat(k), 460, 990, 1.0, k > .5 ? 'effort' : 'joy');
  for (let i = 0; i < 8; i++) {
    const p = ((lt * .45 + i / 8) % 1);

    g += `<g opacity="${f3(Math.sin(Math.PI * p) * .9)}">${icon('heart', 560 + Math.sin(i * 2.1 + lt) * 60 + i * 12, 760 - p * 240, 34 + (i % 3) * 8, C.pink)}</g>`;
  }

function sParents(lt, S) {
  const P = PLAN.parents(S);
  let g = '';
  for (let i = 0; i < 26; i++) g += `<circle cx="${f(rnd(i) * 1920)}" cy="${f(rnd(i + 50) * 420)}" r="${f(1.5 + rnd(i + 9) * 2.5)}" fill="#fff" opacity="${f3(.35 + .35 * Math.sin(lt * 3 + i))}"/>`;
  g += `<circle cx="1730" cy="${f(250 - 100 * eOut(seg(lt, .2, 2)))}" r="62" fill="#FFF3C4"/><circle cx="1758" cy="${f(232 - 100 * eOut(seg(lt, .2, 2)))}" r="54" fill="url(#gBgTop)"/>`;
  g += headline(lt, L.parents, { fill: '#fff' });
  const hour = lerp(19.5, 20, eIO(seg(lt, .6, P.tLock)));
  const hh = Math.floor(hour), mm = Math.min(59, Math.floor((hour - hh) * 60));
  let c = card(110, 260, 760, 300) + txt(150, 330, L.allowed, 34, { anchor: 'start', family: FONT_B, weight: 800, fill: C.muted }) +
          txt(150, 410, '07:00 – 20:00', 72, { anchor: 'start' });
  const bx = 150, bw = 680, by = 460, X = h => bx + bw * h / 24;
  c += `<rect x="${bx}" y="${by}" width="${bw}" height="26" rx="13" fill="${C.line}"/><rect x="${f(X(7))}" y="${by}" width="${f(X(20) - X(7))}" height="26" rx="13" fill="${C.mint}"/>`;
  c += ln({ x: X(hour), y: by - 14 }, { x: X(hour), y: by + 40 }, 6, C.coral) + txt(X(hour), by + 78, `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, 30, { fill: C.coral });
  g += pop(lt, .3, 490, 410, c);
  const scr = lt < P.tLock ? scrGame(lt)
            : lt < P.tExtra + .3 ? scrLock({ time: '20:00', lockK: eOut(seg(lt, P.tLock, P.tLock + .3)) })
            : scrDesktop(lt, Math.max(0, 59 - Math.floor(lt - P.tExtra - .3)));
  g += laptop(1390, 480, 620, scr);
  g += pop(lt, P.tExtra, 1390, 790, pill(1390, 790, L.extra, { w: L.extraW, h: 80, size: L.extraSize, ic: 'timer', icColor: C.mint }));
  g += pop(lt, P.tReset, 490, 750, card(110, 620, 760, 250) + icon('calendar', 220, 745, 150, C.coral) +
       txt(220, 788, lt > P.tReset + .8 ? '19' : '18', 54, { fill: C.ink }) +
       txt(330, 720, L.resets1, 40, { anchor: 'start' }) + txt(330, 772, L.resets2, L.resetsSize, { anchor: 'start', family: FONT_B, weight: 800, fill: C.muted }));
  return g;
}

function sPrivacy(lt, S) {

  [['camera', L.rows[0]], ['pc', L.rows[1]], ['cloudOff', L.rows[2]]].forEach(([ic, label], i) => {
    const y = 330 + i * 190, t0 = P.rows[i];
    g += pop(lt, t0, 1340, y + 65, card(900, y, 900, 130, 65) + `<circle cx="965" cy="${y + 65}" r="46" fill="${C.indigo}" opacity=".12"/>` + icon(ic, 965, y + 65, 60, C.indigo) + txt(1035, y + 65 + L.rowSize * .36, label, L.rowSize, { anchor: 'start' }));

function sOutro(lt, S) {
  let g = confetti(lt, 60, seg(lt, .2, .8)) + `<ellipse cx="960" cy="1140" rx="1300" ry="240" fill="#DCE4FF" opacity=".75"/>`;
  g += `<g transform="translate(960 300) scale(${f3(eBack(seg(lt, .1, .7)))})">${logo(220)}</g>`;
  const a1 = eOut(seg(lt, .4, 1)), a2 = eOut(seg(lt, .9, 1.5)), a3 = eOut(seg(lt, 1.6, 2.2));
  g += `<g opacity="${f3(a1)}" transform="translate(0 ${f((1 - a1) * 30)})">${txt(960, 530, `Exercise <tspan fill="${C.indigo}">Unlock</tspan>`, 116)}</g>`;
  g += `<g opacity="${f3(a2)}">${txt(960, 610, L.outro, L.outroSize, { family: FONT_B, weight: 800, fill: C.muted })}</g>`;
  g += `<g opacity="${f3(a3)}">${pill(960, 705, L.oss, { w: L.ossW, h: 70, size: 28, color: C.indigo })}</g>`;
  const k = (1 - Math.cos(lt * 3.4)) / 2;
  g += shadowEl(310, 975, 90, 16) + drawKid(poseSquat(k), 290, 975, 1.1, k > .5 ? 'effort' : 'joy');
  const pk = (1 - Math.cos(lt * 3.4 + 1.6)) / 2;
  g += shadowEl(1650, 975, 200, 16) + drawKid(posePush(pk), 1460, 975, .95, pk > .5 ? 'effort' : 'happy');
  return g;
}

const SCENES = { intro: sIntro, sitting: sSitting, how: sHow, ai: sAI, earn: sEarn, hour: sHour, health: sHealth, parents: sParents, privacy: sPrivacy, outro: sOutro };

// ---------------------------------------------------------------- sound cues (scene-local seconds)
const EV = {
  intro: S => [[.12, 'pop'], [.6, 'sparkle']],
  sitting: S => [[mark(S, 'posture', 5), 'pop'], [mark(S, 'energy', 6), 'pop'], [mark(S, 'focus', 7), 'pop']],
  how: S => { const P = PLAN.how(S); return [[P.tPw, 'scratch'], [P.tPw + .9, 'pop'], ...P.reps.map(r => [tcOf(r), 'ding'])]; },
  ai: S => { const P = PLAN.ai(S); return [...P.reps.filter(r => r.counts !== false).map(r => [tcOf(r), 'ding']), [P.tH + .3, 'buzz']]; },
  earn: S => { const P = PLAN.earn(S); return [...P.reps.map(r => [tcOf(r), 'ding']), [tcOf(P.reps[1]) + .45, 'success'], [tcOf(P.reps[9]) + .45, 'success']]; },
  hour: S => { const P = PLAN.hour(S); return [[.4, 'pop'], [P.tFive, 'chime'], [P.tLock, 'click'], ...P.reps.map(r => [tcOf(r), 'ding']),
               [tcOf(P.reps[P.reps.length - 1]) + .3, 'success'], ...[0, 1, 2, 3].map(i => [P.tGuar + .15 + i * .25, 'pop'])]; },
  health: S => { const P = PLAN.health(S); return [[P.tW, 'pop'], ...P.cards.map(t => [t, 'pop'])]; },
  parents: S => { const P = PLAN.parents(S); return [[.3, 'pop'], [P.tLock, 'click'], [P.tExtra, 'pop'], [P.tReset, 'pop']]; },
  privacy: S => { const P = PLAN.privacy(S); return [[.3, 'pop'], ...P.rows.map(t => [t, 'pop'])]; },
  outro: S => [[.1, 'success']],
};
function collectSfx() {
  const tl = TL || defaultTimeline(), out = [];
  tl.scenes.forEach((S, i) => {
    if (i > 0) out.push([S.start - .15, 'whoosh']);
    for (const [t, type] of EV[S.id](S)) if (t >= 0 && t <= S.dur + .3) out.push([S.start + t, type]);
  });
  return out;
}

  <linearGradient id="gGame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD3FF"/><stop offset="1" stop-color="#D2F3FF"/></linearGradient>
  <linearGradient id="gFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1FBF9C"/><stop offset="1" stop-color="#5B6CFF"/></linearGradient>
  <linearGradient id="gCone" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#2BFF88" stop-opacity=".55"/><stop offset="1" stop-color="#2BFF88" stop-opacity="0"/></linearGradient>
  <linearGradient id="gBeam" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#BFE6FF" stop-opacity=".85"/><stop offset="1" stop-color="#BFE6FF" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1F2547" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

function sceneVis(S, lt, fadeIn = .45, fadeOut = .45) {
  return eOut(seg(lt, 0, fadeIn)) * (1 - eIO(seg(lt, S.dur, S.dur + fadeOut)));
}
function background(t, tl) {
  let dusk = 0;
  for (const S of tl.scenes) if (S.id === 'parents') dusk = Math.max(dusk, eIO(seg(t - S.start, -.2, .6)) * (1 - eIO(seg(t - S.start, S.dur - .2, S.dur + .5))));
  const top = mix('#E8F2FF', '#2B2766', dusk), bot = mix('#F7F0FF', '#B86B9E', dusk);
  let g = `<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>
           <linearGradient id="gBgTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${mix('#E8F2FF', '#3A2F78', dusk)}"/></linearGradient></defs>`;
  g += `<rect width="1920" height="1080" fill="url(#gBg)"/>`;
  const blobs = [[200, 180, 220, C.indigo], [1700, 160, 260, C.pink], [1600, 900, 300, C.mint], [300, 950, 240, C.yellow], [960, 540, 380, C.indigo]];
  blobs.forEach(([x, y, r, c], i) => { g += `<circle cx="${f(x + Math.sin(t * .3 + i) * 40)}" cy="${f(y + Math.cos(t * .25 + i * 2) * 30)}" r="${r}" fill="${c}" opacity="${f3(.07 * (1 - dusk * .6))}"/>`; });
  return g;
}
function render(t) {
  const tl = TL || defaultTimeline();
  let body = DEFS + background(t, tl);
  tl.scenes.forEach((S, i) => {
    const lt = t - S.start;
    const last = i === tl.scenes.length - 1;
    if (lt < -.01 || (!last && lt > S.dur + .45)) return;
    const a = (i === 0 ? 1 : eOut(seg(lt, 0, .45))) * (last ? 1 : 1 - eIO(seg(lt, S.dur, S.dur + .45)));
    const dy = i === 0 ? 0 : (1 - eOut(seg(lt, 0, .45))) * 30;
    body += `<g opacity="${f3(a)}" transform="translate(0 ${f(dy)})">${SCENES[S.id](lt, S)}</g>`;
  });
  if (tl.total - t < .8) body += `<rect width="1920" height="1080" fill="#fff" opacity="${f3(eIO(seg(t, tl.total - .8, tl.total)))}"/>`;
  document.getElementById('stage').innerHTML = body;
}
window.render = render; window.setTimeline = setTimeline; window.setLang = setLang; window.collectSfx = collectSfx;

// ---------------------------------------------------------------- standalone preview
const qLang = new URLSearchParams(location.search).get('lang');
if (qLang) setLang(qLang);
if (location.search.includes('render')) document.body.classList.add('render');
else {
  const tl = () => TL || defaultTimeline();
  let playing = true, t0 = performance.now(), cur = 0;
  const scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), btn = document.getElementById('play');
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; t0 = performance.now() - cur * 1000; };
  scrub.oninput = () => { cur = scrub.value / 1000 * tl().total; t0 = performance.now() - cur * 1000; render(cur); };
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById('stage').style.width = 1920 * s + 'px'; document.getElementById('stage').style.height = 1080 * s + 'px'; };
  addEventListener('resize', fit); fit();
  (function loop() {
    if (playing) { cur = ((performance.now() - t0) / 1000) % tl().total; scrub.value = cur / tl().total * 1000; render(cur); clock.textContent = cur.toFixed(1); }
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
