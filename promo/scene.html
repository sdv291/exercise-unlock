<!doctype html>
<!--
  Exercise Unlock — promo animation.
  Every frame is a pure function of time: render(t) rebuilds the SVG.
  build.py injects the narration timeline (setTimeline) and grabs frames;
  opened directly in a browser it plays a silent preview with a scrubber.
  The illustrated kid (assets/) sits in a layer of its own above the
  stage: those <image>s are created once and only moved per frame, so a
  frame is never grabbed before a picture has loaded.
-->
<html>
<head>
<meta charset="utf-8">
<title>Exercise Unlock — promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #11131f; overflow: hidden; }
  svg { display: block; }
  #wrap { position: relative; width: 1920px; height: 1080px; }
  #wrap svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #photos { pointer-events: none; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
        padding: 10px 16px; background: rgba(0,0,0,.55); color: #fff; font: 14px system-ui; }
  #ui input { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="wrap">
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"></svg>
<svg id="photos" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <image id="ph-hoodie" href="assets/kid-hoodie.webp" visibility="hidden"/>
  <image id="ph-shoes" href="assets/kid-shoes.webp" visibility="hidden"/>
  <image id="ph-polo" href="assets/kid-polo.webp" visibility="hidden"/>
</svg>
</div>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0.0</span></div>

const clamp =(x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp  = (a, b, t) => a + (b - a) * t;
const seg   = (t, a, b) => clamp((t - a) / (b - a));
const eOut  = t => 1 - Math.pow(1 - t, 3);
const eIO   = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const f  = v => Math.round(v * 10) / 10;
const f3 = v => Math.round(v * 1000) / 1000;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mid = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
// angle convention: degrees from "up", clockwise positive (90 = right, 180 = down)
const mv = (p, len, a) => { const r = a * Math.PI / 180; return { x: p.x + len * Math.sin(r), y: p.y - len * Math.cos(r) }; };
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',') + ')'; };

// ---------------------------------------------------------------- timeline
let TL = null;
function defaultTimeline() {
  const d = [['intro',6],['sitting',10.5],['how',10.5],['ai',10.5],['moves',10],['earn',11],['hour',18],
             ['phone',12],['health',18],['parents',14],['setup',11],['privacy',11],['outro',8]];
  let t = 0;
  return { scenes: d.map(([id, dur]) => { const s = { id, start: t, dur, cues: [] }; t += dur; return s; }), total: t };
}
function setTimeline(tl) { TL = tl; }
// Scene-local time of a named moment in the narration (build.py maps each
// mark to the word that says it, per language); fallback for the preview.
function mark(S, name, fallback) { return S.marks && S.marks[name] != null ? S.marks[name] : fallback; }

// ---------------------------------------------------------------- primitives
function txt(x, y, s, size, o = {}) {
  const { fill = C.ink, anchor = 'middle', family = FONT_H, op = 1 } = o;
  const weight = o.weight ?? (family === FONT_H ? H_WEIGHT : 700);
  return `<text x="${f(x)}" y="${f(y)}" font-family="${family}" font-weight="${weight}" font-size="${size}" fill="${fill}" text-anchor="${anchor}"${op < 1 ? ` opacity="${f3(op)}"` : ''}>${s}</text>`;
}
function ln(a, b, w, c, extra = '') {
  return `<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
}
function ci(p, r, c, extra = '') { return `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${r}" fill="${c}" ${extra}/>`; }
function pop(lt, t0, cx, cy, inner, dur = .45) {
  const k = eBack(seg(lt, t0, t0 + dur));
  if (lt < t0) return '';
  return `<g transform="translate(${f(cx)} ${f(cy)}) scale(${f3(k)}) translate(${f(-cx)} ${f(-cy)})" opacity="${f3(seg(lt, t0, t0 + dur * .5))}">${inner}</g>`;
}
function headline(lt, html, o = {}) {
  const { x = 960, y = 150, size = 70, delay = .1, anchor = 'middle', fill = C.ink } = o;
  const a = eOut(seg(lt, delay, delay + .55));
  return `<g opacity="${f3(a)}" transform="translate(0 ${f((1 - a) * 26)})">${txt(x, y, html, size, { anchor, fill })}</g>`;
}
function floor(y, op = .55) { return `<rect x="0" y="${y}" width="1920" height="${1080 - y}" fill="#DCE4FF" opacity="${op}"/>`; }
function shadowEl(x, y, rx, ry) { return `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${C.ink}" opacity=".12"/>`; }
function card(x, y, w, h, r = 28, fill = '#fff') {
  return `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${r}" fill="${fill}" filter="url(#shadow)"/>`;
}

  play: c => `<rect x="6" y="14" width="88" height="62" rx="10" fill="${c}"/><path d="M42 30 L64 45 L42 60Z" fill="#fff"/><rect x="30" y="80" width="40" height="8" rx="4" fill="${c}"/>`,
  count: c => `<rect x="6" y="22" width="88" height="56" rx="18" fill="${c}"/><text x="50" y="64" font-family="${FONT_H}" font-weight="700" font-size="40" fill="#fff" text-anchor="middle">+1</text>`,
  phone: c => `<rect x="26" y="4" width="48" height="92" rx="10" fill="${c}"/><rect x="32" y="14" width="36" height="66" rx="4" fill="#fff"/><circle cx="50" cy="88" r="4" fill="#fff"/>`,

function icon(name, cx, cy, size, c) {
  return `<g transform="translate(${f(cx - size / 2)} ${f(cy - size / 2)}) scale(${f3(size / 100)})">${ICONS[name](c)}</g>`;
}
function padlock(cx, cy, size, k, c = '#fff', hole = C.indigo) {
  const lift = (1 - k) * 22;
  return `<g transform="translate(${f(cx - size / 2)} ${f(cy - size / 2)}) scale(${f3(size / 100)})">
    <path d="M32 ${f(50 - lift)} V${f(34 - lift)} A18 18 0 0 1 68 ${f(34 - lift)} V${f(50 - lift)}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round"/>
    <rect x="16" y="44" width="68" height="50" rx="13" fill="${c}"/>
    <circle cx="50" cy="64" r="8" fill="${hole}"/><rect x="46.5" y="66" width="7" height="15" rx="3" fill="${hole}"/></g>`;
}

// width of the rounded tile, centred on the origin.

// A real QR code for the landing page, made by the app's own encoder
// (ExerciseUnlockCommon/QrCode.cpp: version 4, level M). Lower case on
// purpose: the path is case-sensitive on the server.
const QR_LANDING = [
  '111111101010101000111101001111111', '100000101101001011000001101000001', '101110100101011010101001001011101',
  '101110101010100000110100101011101', '101110100011000011100111101011101', '100000100011010111000011001000001',
  '111111101010101010101010101111111', '000000001000000111110010100000000', '101101110101100101100101001001011',
  '001110000011010001111011001101101', '110011110101110000101111011111011', '101100010101000111011111010101001',
  '101011110010101110011110110111011', '100101010100001000001001000100110', '101111100010101001011110101001000',
  '000110001011010100000111011010100', '010101110001011010001110111011100', '011010001001011110001011111011011',
  '110010101011101100100100001110110', '001001000110001111110011111010010', '100100111000011010000010000001110',
  '100110010000010111001111101001001', '001101101001011100111011111100111', '011111001100101100001001100011001',
  '101111110001000011010000111110001', '000000001001111110110101100011000', '111111101000011011111101101010000',
  '100000101010010111101001100011101', '101110100101101011100011111110110', '101110101110110010010110000101111',
  '101110101100010111101110011100100', '100000100111100001101011110110001', '111111101000001011111101011010100',
];
// m = module size; the white square (with a 2-module quiet zone) is
// (33 + 4) * m wide, top-left at x, y.
function qrCode(x, y, m) {
  const n = QR_LANDING.length, s = (n + 4) * m;
  let d = '';
  QR_LANDING.forEach((row, r) => {
    for (let c = 0; c < n; c++) if (row[c] === '1') d += `M${(c + 2) * m} ${(r + 2) * m}h${m}v${m}h${-m}z`;
  });
  return `<g transform="translate(${f(x)} ${f(y)})"><rect width="${s}" height="${s}" rx="${m}" fill="#fff"/><path d="${d}" fill="${C.ink}" shape-rendering="crispEdges"/></g>`;
}

// ---------------------------------------------------------------- the kid (side view, facing right)
function poseSquat(k) {                       // k: 0 standing .. 1 deep squat
  const ankle = { x: 0, y: -16 };
  const knee = mv(ankle, LEN.shin, 32 * k);
  const hip = mv(knee, LEN.thigh, -82 * k);
  const sh = mv(hip, LEN.torso, 36 * k);
  const el = mv(sh, LEN.ua, lerp(172, 95, k));
  const wr = mv(el, LEN.fa, lerp(165, 88, k));
  const headA = lerp(0, 16, k);
  return { ankle, knee, hip, sh, el, wr, head: mv(sh, LEN.neck + LEN.R, headA), headA, foot: { x: 30, y: -14 } };
}
function poseCheer(k, bounce = 0) {           // arms up
  const p = poseSquat(bounce);
  p.el = mv(p.sh, LEN.ua, lerp(172, 52, k));          // front arm: forward-up, clear of the face
  p.wr = mv(p.el, LEN.fa, lerp(165, 4, k));
  p.back = { el: mv(p.sh, LEN.ua, lerp(172, -38, k)) };  // back arm: up and behind
  p.back.wr = mv(p.back.el, LEN.fa, lerp(165, -12, k));
  return p;
}
function ik(a, b, l1, l2, side) {
  const dx = b.x - a.x, dy = b.y - a.y; const d = Math.min(Math.hypot(dx, dy), l1 + l2 - .01);
  const A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const t = Math.atan2(dy, dx) + side * A;
  return { x: a.x + l1 * Math.cos(t), y: a.y + l1 * Math.sin(t) };
}

// ---------------------------------------------------------------- the illustrated kid (photos layer)
// Natural sizes of assets/*.webp; the pictures have transparent margins.
const PHOTOS = { hoodie: [1024, 1536], shoes: [1312, 1199], polo: [1024, 1536] };
let SHOTS = {}, CUR = { a: 1, dy: 0 };
// cx: centre, bottom: where the picture ends, h: height on screen. Takes
// the current scene's fade (CUR); returns '' so it can sit in a template.
function photo(name, cx, bottom, h, o = {}) {
  const [nw, nh] = PHOTOS[name], w = h * nw / nh;
  SHOTS[name] = { x: cx - w / 2, y: bottom - h + CUR.dy, w, h, a: CUR.a * (o.a ?? 1), rot: o.rot || 0 };
  return '';
}
function placePhotos(fade) {
  for (const name in PHOTOS) {
    const el = document.getElementById('ph-' + name), s = SHOTS[name];
    if (!s || s.a * fade <= .002) { el.setAttribute('visibility', 'hidden'); continue; }
    el.setAttribute('visibility', 'visible');
    el.setAttribute('x', f(s.x)); el.setAttribute('y', f(s.y));
    el.setAttribute('width', f(s.w)); el.setAttribute('height', f(s.h));
    el.setAttribute('opacity', f3(s.a * fade));
    el.setAttribute('transform', s.rot ? `rotate(${f(s.rot)} ${f(s.x + s.w / 2)} ${f(s.y + s.h)})` : '');
  }
}
window.photosReady = Promise.all(Object.keys(PHOTOS).map(n => {
  const im = new Image();
  im.src = document.getElementById('ph-' + n).getAttribute('href');
  return im.decode();
}));

function sPhone(lt, S) {
  const P = PLAN.phone(S);
  let g = floor(900) + headline(lt, L.phone);
  const n = repCount(P.reps, lt), paired = lt >= P.tPair;
  // the PC: QR code on the lock screen until the phone is paired, then the tile
  const lx = 1440, ly = 500, lw = 700;
  const scr = scrLock({ time: '19:30', qrK: 1 - seg(lt, P.tPair - .2, P.tPair), tileK: eBack(seg(lt, P.tPair, P.tPair + .45)),
                        su: n, earned: `${n * 5}:00`, ready: n * 5 >= 10 });
  g += laptop(lx, ly, lw, scr);
  // the phone: held up to scan the code, then stood on the floor facing the child
  if (lt >= P.tScan - .4) {
    const up = eOut(seg(lt, P.tScan - .4, P.tScan)), down = eIO(seg(lt, P.tFloor - .2, P.tFloor + .5));
    const px = lerp(1000, 1010, down), py = lerp(lerp(1100, 560, up), 742, down), ph = lerp(320, 270, down), rot = lerp(-14, 0, down);
    if (down > 0) g += `<path d="M${f(px - 52)} 900 L${f(px)} ${f(py + 60)} L${f(px + 52)} 900Z" fill="#9AA3C8" opacity="${f3(down)}"/>`;   // stand
    if (lt < P.tPair && up > .9) {
      const qr = { x: lx, y: ly + 50 };
      g += `<polygon points="${f(px + 30)},${f(py - 120)} ${qr.x - 70},${qr.y - 70} ${qr.x - 70},${qr.y + 70}" fill="${C.neon}" opacity="${f3(.25 + .1 * Math.sin(lt * 12))}"/>`;
    }
    const J = poseSitup(repK(P.reps, lt));
    g += phoneDev(px, py, ph, scrPhone(J, n, { scan: lt < P.tPair ? (lt * 1.6) % 1 : 0, connected: paired }), rot);
    if (paired && down > .99) {
      // reps travel to the PC
      for (let i = 0; i < 3; i++) {
        const p = ((lt * .8 + i / 3) % 1);
        g += `<circle cx="${f(lerp(px + 80, lx - 380, p))}" cy="${f(lerp(py - 40, ly + 40, p) - Math.sin(Math.PI * p) * 70)}" r="7" fill="${C.indigo}" opacity="${f3(Math.sin(Math.PI * p) * .7)}"/>`;
      }
      P.reps.forEach(r => {
        const p = (lt - tcOf(r)) / .8;
        if (p < 0 || p > 1) return;
        const x = lerp(px, lx, eIO(p)), y = lerp(py - 170, ly + 40, eIO(p)) - Math.sin(Math.PI * p) * 120;
        g += `<g opacity="${f3(1 - Math.pow(p, 4))}">${pill(x, y, L.plusMin(5), { w: 160, h: 54, size: 28, fill: C.coral, color: '#fff' })}</g>`;
      });
    }
  }
  // the child on the floor, side-on to the phone
  const k = repK(P.reps, lt);
  g += shadowEl(410, 900, 230, 18) + drawKid(poseSitup(k), 470, 900, 1.15, k > .5 ? 'effort' : 'happy');
  return g;
}

function sSetup(lt, S) {
  const P = PLAN.setup(S);
  let g = floor(930) + headline(lt, L.setup);
  // the boy gets ready while the parent runs the calibration
  g += shadowEl(400, 935, 230, 22) + photo('shoes', 410, 948, 470, { a: seg(lt, .1, .5) });
  const lx = 1260, ly = 520, lw = 900;
  g += pop(lt, .2, lx, ly, laptop(lx, ly, lw, scrWizard(lt, P)));
  const sk = eOut(seg(lt, P.tSet - .1, P.tSet + .5));
  if (sk > 0) g += `<g opacity="${f3(sk)}" transform="translate(0 ${f((1 - sk) * 120)})">${settingsWin(840, 250, 860, 600)}</g>`;
  return g;
}

function cycleDiagram(t) {
  let g = `<rect width="1920" height="1080" fill="#F3F1FF" opacity="${f3(.9 * seg(t, -.3, .3))}"/>`;
  g += headline(t + .1, L.cycle(C.coral), { y: 250, size: 76 });
  const xs = [360, 760, 1160, 1560], cy = 560;
  xs.forEach((x, i) => {
    const t0 = .15 + i * .25;
    if (i > 0) { const a = seg(t, t0 - .1, t0 + .2); g += `<g opacity="${f3(a)}">${ln({ x: xs[i - 1] + 140, y: cy }, { x: x - 150, y: cy }, 8, C.coral)}<path d="M${x - 166} ${cy - 16} L${x - 146} ${cy} L${x - 166} ${cy + 16}" stroke="${C.coral}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`; }
    let inner = `<circle cx="${x}" cy="${cy}" r="120" fill="#fff" filter="url(#shadow)"/>`;
    if (i % 2 === 0) inner += laptop(x, cy - 8, 150, scrGame(t + i)) + txt(x, cy + 175, L.play, 34);
    else inner += drawKid(poseSquat((1 - Math.cos(t * 3.6 + i)) / 2), x - 12, cy + 88, .42, 'effort') + txt(x, cy + 175, L.move, 34, { fill: C.coral });
    g += pop(t, t0, x, cy, inner);
  });
  const la = seg(t, 1.2, 1.6);
  g += `<path d="M1560 790 Q960 960 360 790" stroke="${C.indigo}" stroke-width="6" fill="none" stroke-dasharray="14 14" opacity="${f3(la)}"/>` +
       `<path d="M384 772 L358 790 L388 806" stroke="${C.indigo}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${f3(la)}"/>` +
       txt(960, 920, L.repeat, 30, { family: FONT_B, weight: 800, fill: C.indigo, op: la });
  return g;
}

function sHour(lt, S) {
  const P = PLAN.hour(S);
  let m = headline(lt, L.hour);
  let rem = 60;
  if (lt >= P.t60) rem = lerp(60, 5, eIO(seg(lt, P.t60, P.tFive)));
  if (lt >= P.tFive) rem = lerp(5, 0, seg(lt, P.tFive + .2, P.tLock));
  const n = repCount(P.reps, lt), lc = lastCount(P.reps, lt);
  if (lt >= P.tLock && lc != null) rem = 60 * lerp(Math.max(0, n - 1), n, eOut(clamp((lt - lc) / .6))) / P.reps.length;
  const col = rem > 20 ? C.mint : rem > 6 ? mix(C.yellow, C.mint, (rem - 6) / 14) : mix(C.coral, C.yellow, rem / 6);
  const cx = 560, cy = 545;
  m += pop(lt, .4, cx, cy, ring(cx, cy, 200, rem / 60, col));
  const locked = lt >= P.tLock && n === 0;
  if (lt >= .4) {
    if (locked) m += padlock(cx, cy, 170, eOut(seg(lt, P.tLock, P.tLock + .3)), C.coral, '#fff');
    else {
      const mm = Math.floor(rem), ss = Math.floor((rem - mm) * 60);
      m += txt(cx, cy + 22, `${mm}:${String(ss).padStart(2, '0')}`, 104, { op: seg(lt, .5, .9) }) +
           txt(cx, cy + 82, n >= P.reps.length ? L.newSession : L.minutesLeft, 32, { family: FONT_B, weight: 800, fill: n >= P.reps.length ? C.mint : C.muted, op: seg(lt, .5, .9) });
    }
  }
  const scr = lt < P.tLock ? scrGame(lt) : scrLock({ time: '18:31', tileK: 1, sq: n, pu: 0, earned: `${n * 3}:00`, ready: n >= P.reps.length });
  m += laptop(1450, 420, 540, scr);
  const tin = eOut(seg(lt, P.tFive, P.tFive + .45)), tout = eIO(seg(lt, P.tLock + .3, P.tLock + .8));
  if (tin > 0 && tout < 1) m += toast(1160 + (1 - tin) * 800 + tout * 800, 720);
  const ka = eOut(seg(lt, P.tBack - .8, P.tBack - .3));
  if (ka > 0) { const k = repK(P.reps, lt); m += `<g opacity="${f3(ka)}" transform="translate(${f((1 - ka) * 220)} 0)">${shadowEl(1020, 935, 95, 16)}${drawKid(poseSquat(k), 1000, 935, 1.15, k > .5 ? 'effort' : 'happy')}</g>`; m += floaters(P.reps, lt, 1030, 430, '+1'); }
  const dim = 1 - eIO(seg(lt, P.tGuar - .3, P.tGuar + .3));
  let g = `<g opacity="${f3(Math.max(dim, .0))}">${floor(935)}${m}</g>`;
  if (lt > P.tGuar - .3) g += cycleDiagram(lt - P.tGuar);
  return g;
}

       txt(150, 502, L.who, 28, { anchor: 'start', family: FONT_B, weight: 700, fill: C.muted }));
  const items = [['dumbbell', C.indigo], ['sun', C.yellow], ['bulb', C.mint], ['clock', C.coral]].map((a, i) => a.concat(L.cards[i]));

}

const SCENES = { intro: sIntro, sitting: sSitting, how: sHow, ai: sAI, moves: sMoves, earn: sEarn, hour: sHour, phone: sPhone,
                 health: sHealth, parents: sParents, setup: sSetup, privacy: sPrivacy, outro: sOutro };

// ---------------------------------------------------------------- sound cues (scene-local seconds)
const EV = {
  intro: S => [[.12, 'pop'], [.6, 'sparkle']],
  sitting: S => [[mark(S, 'posture', 5), 'pop'], [mark(S, 'energy', 6), 'pop'], [mark(S, 'focus', 7), 'pop']],
  how: S => { const P = PLAN.how(S); return [[P.tPw, 'scratch'], [P.tPw + .9, 'pop'], ...P.reps.map(r => [tcOf(r), 'ding'])]; },
  ai: S => { const P = PLAN.ai(S); return [...P.reps.filter(r => r.counts !== false).map(r => [tcOf(r), 'ding']), [P.tH + .3, 'buzz']]; },
  earn: S => { const P = PLAN.earn(S); return [...P.reps.map(r => [tcOf(r), 'ding']), [tcOf(P.reps[1]) + .45, 'success'], [tcOf(P.reps[9]) + .45, 'success']]; },
  hour: S => { const P = PLAN.hour(S); return [[.4, 'pop'], [P.tFive, 'chime'], [P.tLock, 'click'], ...P.reps.map(r => [tcOf(r), 'ding']),
               [tcOf(P.reps[P.reps.length - 1]) + .3, 'success'], ...[0, 1, 2, 3].map(i => [P.tGuar + .15 + i * .25, 'pop'])]; },
  health: S => { const P = PLAN.health(S); return [[P.tW, 'pop'], ...P.cards.map(t => [t, 'pop'])]; },
  parents: S => { const P = PLAN.parents(S); return [[.3, 'pop'], [P.tWeek, 'pop'], [P.tLock, 'click'], [P.tExtra, 'pop'], [P.tReset, 'pop']]; },
  moves: S => { const P = PLAN.moves(S); return [...[0, 1, 2].map(i => [.3 + i * .18, 'pop']), ...P.t.map(t => [t, 'ding']), [P.tDecide, 'pop']]; },
  phone: S => { const P = PLAN.phone(S); return [[P.tScan - .4, 'whoosh'], [P.tPair, 'success'], ...P.reps.map(r => [tcOf(r), 'ding'])]; },
  setup: S => { const P = PLAN.setup(S); return [[.2, 'pop'], ...P.rowsAt.map((t, i) => [t, i % 3 === 2 ? 'ding' : 'pop']), [P.tSet, 'whoosh']]; },
  privacy: S => { const P = PLAN.privacy(S); return [[.3, 'pop'], ...P.rows.map(t => [t, 'pop'])]; },
  outro: S => [[.1, 'success']],
};
function collectSfx() {
  const tl = TL || defaultTimeline(), out = [];
  tl.scenes.forEach((S, i) => {
    if (i > 0) out.push([S.start - .15, 'whoosh']);
    for (const [t, type] of EV[S.id](S)) if (t >= 0 && t <= S.dur + .3) out.push([S.start + t, type]);
  });
  return out;
}

  <linearGradient id="gBeam" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#BFE6FF" stop-opacity=".85"/><stop offset="1" stop-color="#BFE6FF" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1F2547" flood-opacity=".14"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

function sceneVis(S, lt, fadeIn = .45, fadeOut = .45) {
  return eOut(seg(lt, 0, fadeIn)) * (1 - eIO(seg(lt, S.dur, S.dur + fadeOut)));
}
function background(t, tl) {
  let dusk = 0;
  for (const S of tl.scenes) if (S.id === 'parents') dusk = Math.max(dusk, eIO(seg(t - S.start, -.2, .6)) * (1 - eIO(seg(t - S.start, S.dur - .2, S.dur + .5))));
  const top = mix('#E8F2FF', '#2B2766', dusk), bot = mix('#F7F0FF', '#B86B9E', dusk);
  let g = `<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>
           <linearGradient id="gBgTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${mix('#E8F2FF', '#3A2F78', dusk)}"/></linearGradient></defs>`;
  g += `<rect width="1920" height="1080" fill="url(#gBg)"/>`;
  const blobs = [[200, 180, 220, C.indigo], [1700, 160, 260, C.pink], [1600, 900, 300, C.mint], [300, 950, 240, C.yellow], [960, 540, 380, C.indigo]];
  blobs.forEach(([x, y, r, c], i) => { g += `<circle cx="${f(x + Math.sin(t * .3 + i) * 40)}" cy="${f(y + Math.cos(t * .25 + i * 2) * 30)}" r="${r}" fill="${c}" opacity="${f3(.07 * (1 - dusk * .6))}"/>`; });
  return g;
}
function render(t) {
  const tl = TL || defaultTimeline();
  let body = DEFS + background(t, tl);
  SHOTS = {};
  tl.scenes.forEach((S, i) => {
    const lt = t - S.start;
    const last = i === tl.scenes.length - 1;
    if (lt < -.01 || (!last && lt > S.dur + .45)) return;
    const a = (i === 0 ? 1 : eOut(seg(lt, 0, .45))) * (last ? 1 : 1 - eIO(seg(lt, S.dur, S.dur + .45)));
    const dy = i === 0 ? 0 : (1 - eOut(seg(lt, 0, .45))) * 30;
    CUR = { a, dy };
    body += `<g opacity="${f3(a)}" transform="translate(0 ${f(dy)})">${SCENES[S.id](lt, S)}</g>`;
  });
  const end = eIO(seg(t, tl.total - .8, tl.total));
  if (end > 0) body += `<rect width="1920" height="1080" fill="#fff" opacity="${f3(end)}"/>`;
  document.getElementById('stage').innerHTML = body;
  placePhotos(1 - end);
}
window.render = render; window.setTimeline = setTimeline; window.setLang = setLang; window.collectSfx = collectSfx;

const qLang = new URLSearchParams(location.search).get('lang');

else {
